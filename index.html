<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vicon — Escala da Costura</title>
<meta name="theme-color" content="#14233F">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%231F3A68%22/%3E%3Crect%20x%3D%225%22%20y%3D%225%22%20width%3D%2254%22%20height%3D%2254%22%20rx%3D%2210%22%20fill%3D%22none%22%20stroke%3D%22%23E8B53A%22%20stroke-width%3D%222%22%20stroke-dasharray%3D%224%203%22/%3E%3Cg%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%3E%3Cpath%20d%3D%22M44.5%2018.5c7%206%205.6%2019.6-4.9%2024.3S20%2047.9%2013.5%2054%22%20stroke%3D%22%23E8B53A%22%20stroke-width%3D%223.2%22/%3E%3Cpath%20d%3D%22M48.5%2014.5%2011%2052%22%20stroke%3D%22%23fff%22%20stroke-width%3D%225.5%22/%3E%3Cpath%20d%3D%22M46.4%2016.6l-3.4%203.4%22%20stroke%3D%22%231F3A68%22%20stroke-width%3D%222%22/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1B2437; --denim:#2B4B7C; --denim-2:#3D6199; --paper:#EEF1F5; --card:#FFFFFF; --line:#D4DAE3;
  --muted:#5E6A7E; --chalk:#E4B12A; --chalk-soft:#FBF1D2; --stitch:#C0392B; --stitch-soft:#F8E1DE;
  --ok:#23845A; --ok-soft:#DDF1E6; --warn:#B7791F; --warn-soft:#FCEFD5;
  --l0:#EDF0F4; --l25:#F6B89A; --l50:#F7DE7E; --l75:#8FCFA5; --l100:#23845A;
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#E6EAF2; --denim:#8FB0E6; --denim-2:#AFC6EE; --paper:#12161F; --card:#1B2130; --line:#2E3647;
    --muted:#9AA5B8; --chalk:#E9BD45; --chalk-soft:#3A3120; --stitch:#EF7A6B; --stitch-soft:#3C2224;
    --ok:#4CC08A; --ok-soft:#1C3329; --warn:#E3A94B; --warn-soft:#382C18;
    --l0:#262D3C; --l25:#8E4E36; --l50:#8C7428; --l75:#2F7A50; --l100:#4CC08A;
  }
}
:root[data-theme="dark"]{
  --ink:#E6EAF2; --denim:#8FB0E6; --denim-2:#AFC6EE; --paper:#12161F; --card:#1B2130; --line:#2E3647;
  --muted:#9AA5B8; --chalk:#E9BD45; --chalk-soft:#3A3120; --stitch:#EF7A6B; --stitch-soft:#3C2224;
  --ok:#4CC08A; --ok-soft:#1C3329; --warn:#E3A94B; --warn-soft:#382C18;
  --l0:#262D3C; --l25:#8E4E36; --l50:#8C7428; --l75:#2F7A50; --l100:#4CC08A;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.45}
h1,h2,h3{font-family:var(--fh);font-weight:700;letter-spacing:.01em;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--chalk);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px 48px}

/* top bar */
header.top{background:var(--ink);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
:root[data-theme="dark"] header.top{background:#0C1018}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) header.top{background:#0C1018}}
.top-in{max-width:1280px;margin:0 auto;padding:10px 16px 0;display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 20px}
.brand{display:flex;align-items:baseline;gap:10px;padding-bottom:10px}
.brand h1{font-size:26px;color:#fff}
.brand span{color:#AEB9CC;font-size:14px}
nav.tabs{display:flex;gap:2px;margin-left:auto;overflow-x:auto;max-width:100%}
nav.tabs button{background:transparent;border:0;color:#C9D2E1;padding:10px 14px 12px;font-family:var(--fh);font-size:18px;font-weight:600;border-bottom:4px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:#fff;border-bottom-color:var(--chalk)}
.savestate{font-size:12px;color:#AEB9CC;padding-bottom:12px}

/* generic */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:8px 14px;font-weight:600}
.btn:hover{border-color:var(--denim)}
.btn.primary{background:var(--denim);border-color:var(--denim);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0C1018}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0C1018}}
.btn.chalk{background:var(--chalk);border-color:var(--chalk);color:#1B2437}
.btn.danger{color:var(--stitch);border-color:var(--stitch-soft)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=number],input[type=time],input[type=date],select,textarea{border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:7px 10px;min-height:38px}
input[type=number]{width:90px}
table{border-collapse:collapse}
.hidden{display:none!important}

/* steps */
.steps{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:16px}
@media (max-width:900px){.steps{grid-template-columns:1fr}}
.step h2{font-size:22px;display:flex;align-items:center;gap:10px;margin-bottom:10px}
.step h2 .n{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;font-size:17px}
:root[data-theme="dark"] .step h2 .n{background:var(--denim);color:#0C1018}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .step h2 .n{background:var(--denim);color:#0C1018}}
.daybar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:16px}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;min-width:92px}
.kpi b{display:block;font-family:var(--fh);font-size:24px;line-height:1.1}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.bad b{color:var(--stitch)} .kpi.good b{color:var(--ok)}

/* presence */
.plist{max-height:560px;overflow:auto;border-top:1px solid var(--line)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:8px 2px;border-bottom:1px solid var(--line);align-items:center}
.prow .who b{font-weight:600}
.prow .who small{display:block;color:var(--muted);font-size:12px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 10px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button[aria-pressed="true"].P{background:var(--ok-soft);color:var(--ok)}
.seg button[aria-pressed="true"].A{background:var(--warn-soft);color:var(--warn)}
.seg button[aria-pressed="true"].F{background:var(--stitch-soft);color:var(--stitch)}
.seg button[aria-pressed="true"].J{background:var(--l0);color:var(--ink)}
.partial{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;padding-left:2px}
.partial input{min-height:32px;padding:3px 6px}

/* production */
.prod-add{display:flex;gap:8px;flex-wrap:wrap}
.prod-add select{flex:1;min-width:200px}
.pitem{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.pitem .nm{flex:1;min-width:0}
.pitem .nm small{display:block;color:var(--muted);font-size:12px}

/* allocation */
.alloc{margin-top:16px}
.alerts{display:grid;gap:8px;margin:10px 0 14px}
.alert{border-radius:8px;padding:10px 12px;font-size:14px;border-left:5px solid}
.alert.red{background:var(--stitch-soft);border-color:var(--stitch)}
.alert.amb{background:var(--warn-soft);border-color:var(--warn)}
.alert.blue{background:var(--l0);border-color:var(--denim)}
.lineblock{margin-top:14px}
.lineblock h3{font-size:20px;margin-bottom:8px;display:flex;gap:10px;align-items:baseline}
.lineblock h3 small{font-family:var(--fb);font-size:13px;font-weight:500;color:var(--muted)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.posto{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);padding:10px 10px 8px;display:flex;flex-direction:column;gap:6px}
.posto.gap{border:2px dashed var(--stitch);background:repeating-linear-gradient(135deg,transparent 0 10px,var(--stitch-soft) 10px 12px),var(--card)}
.posto.sup{border-color:var(--warn)}
.posto .ph{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.posto .ph b{font-weight:700;font-size:15px}
.posto .ph span{font-size:12px;color:var(--muted);white-space:nowrap}
.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:7px;padding:3px 4px 3px 6px;font-size:14px;background:var(--paper)}
.chip .nm{flex:1;min-width:0;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.chip input{width:52px;min-height:28px;padding:2px 4px;font-size:13px}
.chip .hh{font-size:12px;color:var(--muted);margin-left:-4px}
.chip .x{border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;padding:0 4px}
.chip .pin{border:0;background:transparent;padding:0 2px;font-size:14px;opacity:.35}
.chip .pin[aria-pressed="true"]{opacity:1}
.lv{display:inline-grid;place-items:center;min-width:32px;height:22px;border-radius:5px;font-size:12px;font-weight:700;color:#1B2437}
.lv0{background:var(--l0);color:var(--muted)} .lv25{background:var(--l25)} .lv50{background:var(--l50)} .lv75{background:var(--l75)} .lv100{background:var(--l100);color:#fff}
.slot{border:1.5px dashed var(--muted);border-radius:7px;padding:2px}
.slot select{width:100%;border:0;background:transparent;min-height:30px;font-size:13px}
.idle{display:flex;flex-wrap:wrap;gap:8px}
.idle .chip{background:var(--card)}

.n4{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--chalk);color:#1B2437;font-size:17px;margin-right:8px;vertical-align:middle}
.guide{border:1px solid var(--line);border-left:5px solid var(--ok);border-radius:8px;padding:10px 12px;margin-top:10px;background:var(--card)}
.guide.amb{border-left-color:var(--warn)} .guide.red{border-left-color:var(--stitch)}
.gh{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.gh b{font-size:16px}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.amb{background:var(--warn-soft);color:var(--warn)} .tag.red{background:var(--stitch-soft);color:var(--stitch)}
.grow{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px dashed var(--line);font-size:14px}
.gtime{font-family:var(--fh);font-weight:700;font-size:17px;color:var(--denim)}
.gbody>div{margin-bottom:4px}
.alts{margin-top:6px}
.alt{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--paper);border-radius:7px;padding:6px 8px;margin-top:4px}
.bloco{margin-top:16px;padding-top:12px;border-top:3px solid var(--ink)}
.bh{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
.bh b{font-family:var(--fh);font-size:24px}
.bh span{font-weight:600}
.slotrow{display:flex;gap:6px;align-items:center}
.slotrow select{flex:1;min-width:0;min-height:34px;font-size:14px;font-weight:600;padding:4px 6px}
.mot{font-size:12px;color:var(--muted);margin:-2px 0 2px 38px}
table.pp td{white-space:nowrap}
@media (max-width:560px){.grow{grid-template-columns:1fr}.alt{flex-direction:column;align-items:flex-start}}
/* matrix */
.mvwrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:var(--radius);background:var(--card)}
table.mv{font-size:12px}
table.mv th,table.mv td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0}
table.mv thead th{position:sticky;top:0;background:var(--card);z-index:2}
table.mv thead tr:nth-child(2) th{top:26px}
table.mv th.l{font-family:var(--fh);font-size:14px;height:26px;background:var(--ink);color:#fff}
table.mv th.pc{writing-mode:vertical-rl;transform:rotate(180deg);height:190px;padding:6px 2px;font-weight:600;white-space:nowrap;text-align:left;font-size:11.5px}
table.mv td.nm,table.mv th.nm{position:sticky;left:0;background:var(--card);z-index:1;min-width:190px;text-align:left;padding:4px 8px}
table.mv thead th.nm{z-index:3}
table.mv td.nm button{border:0;background:transparent;padding:0;font-weight:600;text-align:left;width:100%}
table.mv td.nm small{color:var(--muted)}
table.mv td.c button{width:34px;height:28px;border:0;font-size:11px;font-weight:700;background:var(--l0);color:var(--muted)}
table.mv td.c button.lv25{background:var(--l25);color:#1B2437} table.mv td.c button.lv50{background:var(--l50);color:#1B2437}
table.mv td.c button.lv75{background:var(--l75);color:#1B2437} table.mv td.c button.lv100{background:var(--l100);color:#fff}
table.mv tr.inactive td{opacity:.45}
table.mv tfoot td{position:sticky;bottom:0;background:var(--card);font-weight:700;text-align:center;height:28px}
table.mv tfoot td.bad{color:var(--stitch)} table.mv tfoot td.lim{color:var(--warn)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;align-items:center}

/* forms / lists */
.two{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:16px;margin-top:16px}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column;max-height:65vh;overflow:auto;border-top:1px solid var(--line)}
.list button{border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;padding:10px 8px}
.list button[aria-current="true"]{background:var(--chalk-soft);box-shadow:inset 4px 0 0 var(--chalk)}
.list button small{display:block;color:var(--muted);font-size:12px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.ops{width:100%;border-top:1px solid var(--line)}
.ops td{padding:6px 4px;border-bottom:1px solid var(--line)}
.ops select{width:100%}
.section-title{font-size:22px;margin:22px 0 8px}

/* ranking */
table.rank{width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;font-size:14px}
table.rank th{background:var(--ink);color:#fff;text-align:left;padding:8px;font-weight:600;font-size:13px}
:root[data-theme="dark"] table.rank th{background:#0C1018}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) table.rank th{background:#0C1018}}
table.rank td{padding:8px;border-bottom:1px solid var(--line)}
table.rank tr.top td{background:var(--chalk-soft)}
table.rank td.pos{font-family:var(--fh);font-size:22px;font-weight:700;width:48px;text-align:center}
.bar{height:8px;background:var(--l0);border-radius:4px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--ok)}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:14px 0}
@media (max-width:700px){.podium{grid-template-columns:1fr}}
.podium .card{border-top:6px solid var(--chalk)}
.podium .card b{font-family:var(--fh);font-size:26px;display:block}
.tablewrap{overflow-x:auto}

/* modal + toast */
.modal-bg{position:fixed;inset:0;background:rgba(10,14,22,.55);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--card);border-radius:12px;padding:18px;max-width:560px;width:100%;max-height:85vh;overflow:auto}
.modal h3{font-size:22px;margin-bottom:8px}
.modal textarea{width:100%;min-height:260px;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;z-index:60;font-size:14px;max-width:90vw}
:root[data-theme="dark"] .toast{background:#0C1018;border:1px solid var(--line)}
.empty{text-align:center;padding:40px 16px}
.empty h2{font-size:28px;margin-bottom:8px}
@media (max-width:560px){
  .prow{grid-template-columns:1fr}
  .brand h1{font-size:22px}
  .kpi{min-width:0;flex:1}
  .pgrid{grid-template-columns:minmax(0,1fr)}
}

/* ---------- mobile-first upgrades ---------- */
.bnav{display:none}
select{max-width:100%}
input,select,textarea,button{box-sizing:border-box}
.posto,.slotrow,.lineblock,.bloco,.card{min-width:0}
.pgrid{grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr))}
details.step>summary{list-style:none;cursor:pointer}
details.step>summary::-webkit-details-marker{display:none}
details.step>summary h2{margin-bottom:0}
details.step[open]>summary h2{margin-bottom:10px}
details.step>summary .sumline{font-size:13px;color:var(--muted);margin:2px 0 0 40px}
details.step[open]>summary .sumline{display:none}
.chev{margin-left:auto;font-size:14px;color:var(--muted);transition:transform .15s}
details.step[open] .chev{transform:rotate(180deg)}
.blocks{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px;margin-top:6px;scrollbar-width:thin}
.blocks button{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);border-radius:20px;padding:6px 12px;font-weight:600;font-size:13px;white-space:nowrap}
.blocks button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.blocks button .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:6px;vertical-align:middle;background:var(--ok)}
.blocks button .dot.bad{background:var(--stitch)} .blocks button .dot.amb{background:var(--warn)}
.ppcards,.rankcards{display:none}
.lastsend{font-size:12px;color:var(--muted);margin-top:6px}
.actionbar{display:none}
.modal label.ck{display:flex;gap:8px;align-items:center;padding:6px 0;font-size:14px}
.modal .field input,.modal .field textarea{width:100%}
.warnbox{background:var(--warn-soft);border-left:4px solid var(--warn);padding:8px 10px;border-radius:6px;font-size:13px;margin:8px 0}
.okbox{background:var(--ok-soft);border-left:4px solid var(--ok);padding:8px 10px;border-radius:6px;font-size:13px;margin:8px 0}
.help{font-size:13px;color:var(--muted)}
.help ol{padding-left:18px;margin:6px 0}
@media (max-width:760px){
  body{font-size:16px}
  input[type=text],input[type=number],input[type=time],input[type=date],input[type=email],select,textarea{font-size:16px}
  header.top{position:sticky}
  .top-in{padding:8px 14px}
  .brand{padding-bottom:0}
  nav.tabs,.savestate{display:none}
  .wrap{padding:0 10px calc(150px + env(safe-area-inset-bottom,0px))}
  .bnav{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .bnav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 8px;font-size:11px;font-weight:600;color:var(--muted)}
  .bnav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .bnav button[aria-selected="true"]{color:var(--denim)}
  .bnav button[aria-selected="true"] svg{stroke-width:2.4}
  .actionbar{display:flex;gap:8px;position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:29;padding:8px 10px;background:linear-gradient(to top,var(--paper) 70%,transparent)}
  .actionbar .btn{flex:1;min-height:46px;font-size:15px}
  .daybar{gap:8px}
  .daybar>label{flex:1}
  .daybar input[type=date]{flex:1}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-left:0;width:100%}
  .kpi{padding:6px 8px}
  .kpi b{font-size:20px}
  .kpi span{font-size:11px;line-height:1.2;display:block}
  .card{padding:12px}
  .step h2{font-size:20px}
  .prow{grid-template-columns:1fr}
  .prow .seg{display:grid;grid-template-columns:repeat(4,1fr);width:100%}
  .escbar .seg{display:grid;grid-template-columns:1fr 1fr;width:100%;max-width:none!important}
  .seg button{padding:9px 4px;font-size:13px}
  .plist{max-height:none}
  .prod-add select{min-width:0;width:100%;flex-basis:100%}
  .prod-add input{flex:1}
  .pitem{display:grid!important;grid-template-columns:1fr auto;gap:8px;align-items:center}
  .pitem .nm{grid-column:1/-1}
  .pitem>span.row{grid-column:1/-1;display:grid!important;grid-template-columns:minmax(0,1fr) 0 minmax(0,1fr);gap:4px;font-size:0}
  .pitem>span.row input{width:100%;min-width:0;font-size:16px;padding:6px}
  .pitem>input[type=number]{width:100%!important}
  .pgrid{grid-template-columns:minmax(0,1fr)}
  .posto{padding:8px}
  .slotrow select{min-height:40px}
  .alt{flex-direction:column;align-items:stretch}
  .alt .btn{min-height:40px}
  .grow{grid-template-columns:1fr;gap:4px}
  .bh b{font-size:21px}
  .escbar{flex-wrap:wrap}
  .escbar .btn.hide-m{display:none}
  .pp-table,.rank-table{display:none}
  .ppcards,.rankcards{display:block}
  .ppcard{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:8px;background:var(--card)}
  .ppcard b{font-size:15px}
  .ppcard .ln{display:flex;gap:8px;font-size:13px;padding:3px 0;border-top:1px dashed var(--line)}
  .ppcard .ln>span:first-child{color:var(--denim);font-weight:700;min-width:92px}
  .podium{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .podium .card{padding:8px}
  .podium .card b{font-size:18px;overflow-wrap:anywhere}
  .podium .card>span:last-child{font-size:12px;display:block;line-height:1.3}
  .rankcard{display:grid;grid-template-columns:40px 1fr auto;gap:2px 10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:6px}
  .rankcard.top{background:var(--chalk-soft)}
  .rankcard .pos{font-family:var(--fh);font-size:24px;font-weight:700;text-align:center;grid-row:span 2}
  .rankcard .pct{font-weight:700;font-size:17px}
  .rankcard small{grid-column:2/4;color:var(--muted);font-size:12px}
  table.mv td.nm,table.mv th.nm{min-width:120px;max-width:130px}
  table.mv td.nm small{display:none}
  .modal-bg{align-items:end;padding:0}
  .modal{border-radius:14px 14px 0 0;max-height:92vh;padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px))}
  .modal .row{flex-wrap:wrap}
  .modal .row .btn{flex:1 1 45%;min-height:44px}
  .toast{bottom:calc(130px + env(safe-area-inset-bottom,0px))}
}


/* ---------- GD ---------- */
.gdkpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.gdkpis .kpi{min-width:0}.gdkpis .kpi b{font-size:26px}
.kin{width:100%!important;border:0!important;background:transparent!important;padding:0!important;min-height:0!important;font-family:var(--fh);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums;box-shadow:none!important}
.gdc{padding:14px 16px}
.gdh{display:flex;align-items:center;gap:10px;font-size:17px;margin:0 0 10px;flex-wrap:wrap}
.gdh i{font-style:normal;display:inline-grid;place-items:center;min-width:34px;height:26px;border-radius:7px;color:#fff;font-size:13px;font-weight:800;background:var(--g-tile)}
.gdh i.n03,.gdh i.n07{background:var(--stitch)} .gdh i.n04{background:#D97706} .gdh i.n02,.gdh i.n06{background:#0F766E} .gdh i.n08{background:var(--ink)}
.gdh .auto{font-size:11.5px;font-weight:700;background:var(--ok-soft);color:var(--ok);border-radius:999px;padding:1px 8px}
table.gdt{width:100%;border-collapse:collapse;font-size:14px}
table.gdt th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.gdt td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.gdt .r{text-align:right;font-variant-numeric:tabular-nums}
table.gdt tr.tot td{background:var(--paper)}
table.gdt tr.venc td{background:var(--stitch-soft)}
table.gdt tr.hoje td{box-shadow:inset 0 2px 0 var(--chalk),inset 0 -2px 0 var(--chalk)}
table.gdt tr.quinta td:first-child b::after{content:" · entrega";color:var(--warn);font-weight:700;font-size:12px}
table.gdt.big{font-size:16px}
.qin{width:84px!important;text-align:right;min-height:34px!important}
.tin{width:100%;min-width:140px;min-height:34px!important}
.neg{color:var(--stitch);font-weight:700}
.gdgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}
.gdline{padding:4px 0;font-size:14.5px}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.qgrid .qt{display:block;color:#B45309;font-size:13px;margin-bottom:4px}
.qf{display:flex;flex-direction:column;gap:2px;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:6px}
.qf input{width:100%}
details.hora{margin-top:12px;border-top:2px dashed var(--line);padding-top:10px}
details.hora>summary{cursor:pointer;font-weight:700}
.modal.reu{max-width:860px}
.reutop{display:flex;justify-content:space-between;align-items:center}
.reutime{font-family:var(--fh);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--denim)}
.reutime.over{color:var(--stitch)}
.reusteps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.reusteps button{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 8px;font-weight:600;font-size:13px;text-align:left}
.reusteps button i{font-style:normal;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--paper);font-size:12px;font-weight:800;flex:none}
.reusteps button.on{background:var(--g-btn);color:#fff;border-color:transparent}.reusteps button.on i{background:var(--g-giz);color:#18233A}
.reusteps button.done i{background:var(--ok);color:#fff}
.reubody{font-size:16px}
@media (max-width:760px){
  .gdkpis{grid-template-columns:1fr 1fr}.gdkpis .kpi b,.kin{font-size:21px}
  .gdgrid,.qgrid{grid-template-columns:1fr}
  .reusteps{grid-template-columns:1fr 1fr}
  .reutime{font-size:24px}
  .bnav button{font-size:10.5px}
}

/* ---------- saúde da matriz ---------- */
.saude{margin:0 0 12px;border-left:5px solid var(--ok)}
.saude.red{border-left-color:var(--stitch)} .saude.amb{border-left-color:var(--warn)}
.saude>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.saude>summary::-webkit-details-marker{display:none}
.saude>summary h3{font-size:21px;flex:1;min-width:170px}
.saude[open] .chev{transform:rotate(180deg)}
.hgrp{font-family:var(--fh);font-weight:700;font-size:16px;margin:14px 0 2px;color:var(--denim)}
.hitem{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px dashed var(--line);font-size:14px}
.hitem .tag{margin-top:2px;min-width:62px;text-align:center}
.hitem .tx{flex:1;min-width:0}
.hitem .tx small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.tag.info{background:var(--l0);color:var(--ink)}
/* ---------- takt / yamazumi ---------- */
.yz{margin-top:14px;padding-top:12px;border-top:3px solid var(--ink)}
.yz:first-of-type{border-top:0;padding-top:0}
.yzhead{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
.yzhead b{font-family:var(--fh);font-size:22px}
.yzkpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin:10px 0}
.yzkpis .kpi{min-width:0}
.yzkpis .kpi.warn b{color:var(--warn)}
.yzchart{overflow-x:auto;margin-top:6px}
.yzchart svg{display:block}
.yzchart [data-tip]{cursor:default}
.yzchart g.col:hover .bm{opacity:.82}
.yzmsg{font-size:14px;margin:8px 0}
.yztable{width:100%;font-size:13px;margin-top:8px}
.yztable th{text-align:left;color:var(--muted);font-weight:600;padding:5px 6px;border-bottom:1px solid var(--line)}
.yztable td{padding:5px 6px;border-bottom:1px solid var(--line)}
.yztable td.r,.yztable th.r{text-align:right;font-variant-numeric:tabular-nums}
.yztable tr.gg td{background:var(--stitch-soft)}
.charttip{position:fixed;z-index:70;pointer-events:none;background:var(--ink);color:var(--paper);border-radius:6px;padding:6px 9px;font-size:12.5px;line-height:1.35;max-width:260px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
:root[data-theme="dark"] .charttip{background:#0C1018;color:#E6EAF2;border:1px solid var(--line)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .charttip{background:#0C1018;color:#E6EAF2;border:1px solid var(--line)}}
.simbar{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin:8px 0}
.simbar .field{margin:0}
@media (max-width:760px){.yztable .hm{display:none}.hitem{flex-direction:column;gap:4px}}


/* ===================== TEMA ATELIÊ (denim · giz · pesponto) ===================== */
:root{
  --fb:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fh:"Archivo",system-ui,sans-serif;
  --ink:#18233A; --denim:#1F3A68; --denim-2:#2F5590; --paper:#EDF1F6; --card:#FFFFFF; --line:#DCE3ED;
  --muted:#5C6880; --chalk:#E8B53A; --chalk-soft:#FBF0D3; --stitch:#C2412D; --stitch-soft:#F9E3DE;
  --ok:#21825A; --ok-soft:#DDF2E7; --warn:#B4741A; --warn-soft:#FCEED4;
  --radius:12px;
  --g-denim:linear-gradient(118deg,#101C33 0%,#1A3159 48%,#27497F 100%);
  --g-btn:linear-gradient(180deg,#2B4F88 0%,#1F3A68 100%);
  --g-tile:linear-gradient(145deg,#33599A 0%,#1A3159 100%);
  --g-giz:linear-gradient(145deg,#F2C75E 0%,#DA9D22 100%);
  --sh:0 1px 2px rgba(20,35,63,.06),0 6px 18px -8px rgba(20,35,63,.18);
}
:root[data-theme="dark"]{--ink:#E5EAF3;--denim:#93B3E8;--denim-2:#B3C9EF;--paper:#0F1522;--card:#182132;--line:#2A3448;--muted:#9AA6BB;--chalk:#EBC055;--chalk-soft:#3A3120;
  --g-denim:linear-gradient(118deg,#0A101C 0%,#132341 55%,#1C3762 100%);--g-btn:linear-gradient(180deg,#3B66AD,#2A4E89);--g-tile:linear-gradient(145deg,#3B66AD,#203C6C);--sh:0 1px 2px rgba(0,0,0,.3),0 8px 20px -10px rgba(0,0,0,.6)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#E5EAF3;--denim:#93B3E8;--denim-2:#B3C9EF;--paper:#0F1522;--card:#182132;--line:#2A3448;--muted:#9AA6BB;--chalk:#EBC055;--chalk-soft:#3A3120;
  --g-denim:linear-gradient(118deg,#0A101C 0%,#132341 55%,#1C3762 100%);--g-btn:linear-gradient(180deg,#3B66AD,#2A4E89);--g-tile:linear-gradient(145deg,#3B66AD,#203C6C);--sh:0 1px 2px rgba(0,0,0,.3),0 8px 20px -10px rgba(0,0,0,.6)}}
body{font-family:var(--fb);font-size:15px;letter-spacing:-.003em;font-variation-settings:"wdth" 100;
  background:radial-gradient(1200px 380px at 85% -120px,rgba(47,85,144,.12),transparent 70%),var(--paper);background-attachment:fixed}
h1,h2,h3{font-family:var(--fh);font-weight:700;letter-spacing:-.012em;font-stretch:88%;font-variation-settings:"wdth" 88}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
/* cabeçalho: tecido denim com pesponto */
header.top,:root[data-theme="dark"] header.top{background:var(--g-denim)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) header.top{background:var(--g-denim)}}
header.top{box-shadow:0 2px 0 rgba(0,0,0,.08)}
header.top::after{content:"";position:absolute;left:0;right:0;bottom:5px;border-top:1.5px dashed rgba(232,181,58,.55);pointer-events:none}
.top-in{padding:12px 18px 0;align-items:center}
.brand{align-items:center;gap:12px;padding-bottom:14px}
.tagmark{display:grid;place-items:center;width:44px;height:44px;border-radius:10px;background:#F5F1E6;color:#1F3A68;position:relative;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.tagmark::before{content:"";position:absolute;inset:3px;border:1.3px dashed #C99A2E;border-radius:7px}
.brand span.tagmark{color:#1F3A68}
.tagmark .ic{width:33px;height:33px}
.tagmark .corpo{stroke:#1F3A68;stroke-width:2.6}
.tagmark .olho{stroke:#F5F1E6;stroke-width:1}
.tagmark .linha{stroke:#C2412D;stroke-width:1.6}
.yzchart text.halo{paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round}
.brandtx{display:flex;flex-direction:column;line-height:1.05}
.brand h1{font-size:22px;color:#fff;font-weight:800;letter-spacing:.06em;font-stretch:118%;font-variation-settings:"wdth" 118}
.brand span#brandSub{color:#C9D5EA;font-size:13px;font-weight:500;letter-spacing:.01em;margin-top:3px}
nav.tabs{gap:4px;align-self:flex-end}
nav.tabs button{display:flex;align-items:center;gap:8px;font-family:var(--fb);font-size:14.5px;font-weight:600;color:#BFCBE0;padding:11px 14px 14px;border-bottom:0;position:relative;border-radius:10px 10px 0 0}
nav.tabs button .ic{width:19px;height:19px}
nav.tabs button:hover{color:#fff;background:rgba(255,255,255,.06)}
nav.tabs button[aria-selected="true"]{color:#fff;background:rgba(255,255,255,.1)}
nav.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:12px;right:12px;bottom:9px;border-top:2px dashed var(--chalk)}
.savestate{color:#AFC0DA;align-self:center;padding-bottom:12px}
/* superfícies */
.card{border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--sh)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:9px;border:1px solid var(--line);font-weight:600;transition:border-color .12s,background .12s}
.btn .ic{width:17px;height:17px}
.btn:hover{border-color:var(--denim-2)}
.btn.primary{background:var(--g-btn);border-color:transparent;color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 2px 6px -2px rgba(31,58,104,.55)}
.btn.primary:hover{filter:brightness(1.08)}
:root[data-theme="dark"] .btn.primary{color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#fff}}
.btn.danger{border-color:var(--stitch-soft)}
input[type=text],input[type=number],input[type=time],input[type=date],input[type=email],select,textarea{border:1px solid var(--line);border-radius:9px;background:var(--card)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--denim-2);box-shadow:0 0 0 3px rgba(47,85,144,.18)}
/* KPIs */
.kpi{border-radius:10px;border:1px solid var(--line);background:var(--card);box-shadow:var(--sh);padding:8px 12px}
.kpi b{font-family:var(--fh);font-weight:700;font-size:25px;font-variant-numeric:tabular-nums;font-stretch:90%;font-variation-settings:"wdth" 90}
.kpi span{font-size:12px}
/* cabeçalhos de passo e de página */
.step h2,h2.sh{display:flex;align-items:center;gap:14px;font-size:21px;margin:0}
.sico{position:relative;display:grid;place-items:center;width:42px;height:42px;border-radius:11px;background:var(--g-tile);color:#fff;flex:none;box-shadow:0 3px 8px -3px rgba(26,49,89,.6)}
.sico .ic{width:23px;height:23px}
.sico i{position:absolute;top:-6px;right:-7px;width:21px;height:21px;border-radius:50%;background:var(--g-giz);color:#18233A;font-style:normal;font-size:11.5px;font-weight:800;display:grid;place-items:center;border:2px solid var(--card)}
.stt{display:flex;flex-direction:column;line-height:1.15}
.stt small{font-family:var(--fb);font-size:12px;font-weight:600;color:var(--muted);letter-spacing:0}
details.step>summary .sumline{margin:6px 0 0 56px}
.chev{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--paper)}
.chev .ic{width:18px;height:18px}
h2.ph1{display:flex;align-items:center;gap:12px;font-size:26px}
.pico{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:var(--chalk-soft);color:var(--denim);flex:none;border:1px dashed color-mix(in srgb,var(--chalk) 70%,transparent)}
.pico .ic{width:22px;height:22px}
.pico.sm{width:32px;height:32px;border-radius:9px}.pico.sm .ic{width:19px;height:19px}
.saude>summary h3{display:flex;align-items:center;gap:10px;font-size:20px}
/* separadores com pesponto */
.bloco{border-top:0;position:relative;padding-top:16px}
.bloco::before{content:"";position:absolute;left:0;right:0;top:0;border-top:2px dashed var(--line)}
.yz{border-top:2px dashed var(--line)}
.bh b{font-family:var(--fh);font-size:23px;font-variant-numeric:tabular-nums}
.yzhead b{font-size:20px}
.lineblock h3{font-size:18px}
.posto{border-radius:10px;border:1px solid var(--line);background:var(--card)}
.posto.gap{border:1.5px dashed var(--stitch)}
.posto.sup{border-color:color-mix(in srgb,var(--warn) 60%,var(--line))}
.guide{border-radius:10px;box-shadow:none}
.alert{border-radius:9px;border-left-width:4px}
.blocks button{border-radius:999px;border:1px solid var(--line)}
.blocks button[aria-pressed="true"]{background:var(--g-btn);border-color:transparent}
.seg{border:1px solid var(--line);border-radius:9px}
.seg button+button{border-left:1px solid var(--line)}
.tag{border-radius:999px}
.wtag{display:inline-block;font-size:11px;font-weight:700;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:0 6px;margin-left:4px}
/* tabelas */
table.rank{border-radius:var(--radius);box-shadow:var(--sh);border:1px solid var(--line)}
table.rank th,:root[data-theme="dark"] table.rank th{background:var(--g-denim);font-weight:600}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) table.rank th{background:var(--g-denim)}}
table.mv th.l{background:var(--g-denim);font-family:var(--fh)}
.mvwrap{border-radius:var(--radius);box-shadow:var(--sh)}
.podium .card{border-top:0;position:relative;overflow:hidden}
.podium .card::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--g-giz)}
.podium .card b{font-family:var(--fh);font-size:24px}
table.rank td.pos{font-family:var(--fh)}
.list button[aria-current="true"]{box-shadow:inset 3px 0 0 var(--chalk)}
/* estado vazio */
.card.guia{grid-column:1/-1;display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:linear-gradient(100deg,var(--chalk-soft),var(--card) 60%)}
.card.guia .btn{text-decoration:none}
.emptyart{display:grid;place-items:center;width:84px;height:84px;margin:0 auto 14px;border-radius:50%;background:var(--chalk-soft);color:var(--denim);border:2px dashed color-mix(in srgb,var(--chalk) 75%,transparent)}
.emptyart .ic{width:42px;height:42px;stroke-width:1.5}
.empty h2{font-size:26px}
/* modal e toast */
.modal{border-radius:16px;box-shadow:0 24px 60px -20px rgba(0,0,0,.45)}
.toast{border-radius:10px;background:var(--g-denim)}
/* navegação inferior (celular) */
@media (max-width:760px){
  .top-in{padding:10px 14px}
  .brand{padding-bottom:4px}
  .tagmark{width:38px;height:38px}.tagmark .ic{width:22px;height:22px}

/* ============================ STATE & STORAGE ============================ */
const DEF_SETTINGS={empresa:"Vicon",setor:"Costura",inicio:"07:00",fim:"17:00",almIni:"12:00",almFim:"13:00",contarJustificadas:false,emails:"",emailAssunto:"Escala da costura",emailEndpoint:"",emailToken:"",emailRanking:true,gdVerde:100,gdAmarelo:90};
const S={settings:{...DEF_SETTINGS},postos:[],pessoas:[],produtos:[],acoes:[],dias:{}};
let store=null, tab="dia", curDate=todayISO(), day=null, dayDirty=false;
let selProd=null, rankPeriod="30", mvEditId=null, escView="hora", blocoSel=null, openSteps={s1:window.innerWidth>760,s2:window.innerWidth>760};
let saudeOpen=null, simQ="", simH="", simModo="bal";

function todayISO(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function clone(o){return JSON.parse(JSON.stringify(o))}
function fmtH(h){return (Math.round(h*4)/4).toLocaleString("pt-BR",{maximumFractionDigits:2})+"h"}
function fmtDate(iso){const[y,m,d]=iso.split("-");return `${d}/${m}/${y}`}
function setSave(t){document.getElementById("saveState").textContent=t}
function toast(msg){const r=document.getElementById("toastRoot");r.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(toast._t);toast._t=setTimeout(()=>r.innerHTML="",3200)}

function localStore(){
  const K="vicon_escala_";
  const g=k=>{try{const v=localStorage.getItem(K+k);return v?JSON.parse(v):null}catch(e){return null}};
  const s=(k,v)=>{try{localStorage.setItem(K+k,JSON.stringify(v));return true}catch(e){return false}};
  return{
    mode:"local",
    async load(){
      const L=k=>{const v=g(k);return v&&Array.isArray(v.lista)?v.lista:null};
      const out={settings:g("cfg_settings"),postos:L("cfg_postos"),pessoas:L("cfg_pessoas"),produtos:L("cfg_produtos"),acoes:L("cfg_acoes"),dias:{}};
      try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(K+"dia_")){const v=g(k.slice(K.length));if(v)out.dias[v.data]=v}}}catch(e){}
      return out;
    },
    async saveCfg(key,obj){if(!s("cfg_"+key,obj))throw{message:"armazenamento do navegador indisponível"}},
    async saveDay(d){if(!s("dia_"+d.data,d))throw{message:"armazenamento do navegador indisponível"}},
    async deleteDay(date){try{localStorage.removeItem(K+"dia_"+date)}catch(e){}}
  };
}
function dbStore(db){
  const chain={};
  const q=(path,fn)=>{chain[path]=(chain[path]||Promise.resolve()).then(fn);return chain[path]};
  async function retry(fn){try{return await fn()}catch(e){if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,400+Math.random()*600));return fn()}throw e}}
  return{
    mode:"db",
    async load(){
      const get=async p=>{const s=await retry(()=>db.doc(p).get());return s.exists?s.data():null};
      const [st,po,pe,pr,ac]=await Promise.all([get("cfg/settings"),get("cfg/postos"),get("cfg/pessoas"),get("cfg/produtos"),get("cfg/acoes")]);
      const dias={};const qs=await retry(()=>db.collection("dias").get());qs.docs.forEach(d=>{const v=d.data();if(v&&v.data)dias[v.data]=v});
      return{settings:st,postos:po&&po.lista,pessoas:pe&&pe.lista,produtos:pr&&pr.lista,acoes:ac&&ac.lista,dias};
    },
    saveCfg(key,obj){return q("cfg/"+key,()=>retry(()=>db.doc("cfg/"+key).set(clone(obj))))},
    saveDay(d){return q("dias/"+d.data,()=>retry(()=>db.doc("dias/"+d.data).set(clone(d))))},
    deleteDay(date){return q("dias/"+date,()=>retry(()=>db.doc("dias/"+date).delete()))}
  };
}
const pendingCfg={};
function saveCfg(key){
  clearTimeout(pendingCfg[key]);setSave("Salvando…");
  pendingCfg[key]=setTimeout(async()=>{
    const obj=key==="settings"?S.settings:{lista:S[key]};
    try{await store.saveCfg(key,obj);setSave(store.mode==="db"?"Salvo na nuvem":"Salvo neste aparelho")}
    catch(e){setSave("Erro ao salvar");toast("Não foi possível salvar: "+(e.code==="quota_exceeded"?"limite de armazenamento atingido":(e.message||e.code)))}
  },500);
}
let dayTimer=null,pendingDay=null;
async function writeDay(d){
  d.salvoEm=new Date().toISOString();d.turnoH=turnoH();
  S.dias[d.data]=clone(d);
  try{await store.saveDay(d);setSave(store.mode==="db"?"Salvo na nuvem":"Salvo neste aparelho")}
  catch(e){setSave("Erro ao salvar");toast("Não foi possível salvar o dia: "+(e.message||e.code))}
}
function flushDay(){if(pendingDay){clearTimeout(dayTimer);const d=pendingDay;pendingDay=null;writeDay(d)}}
function saveDaySoon(){
  dayDirty=true;if(pendingDay&&pendingDay!==day)flushDay();
  pendingDay=day;clearTimeout(dayTimer);setSave("Salvando…");
  dayTimer=setTimeout(()=>{const d=pendingDay;pendingDay=null;if(d)writeDay(d)},600);
}

/* ============================ DOMAIN ============================ */
const LV=[0,25,50,75,100];
const posto=id=>S.postos.find(p=>p.id===id);
const pessoa=id=>S.pessoas.find(p=>p.id===id);
const produto=id=>S.produtos.find(p=>p.id===id);
const lvl=(p,pid)=>(p&&p.niveis&&p.niveis[pid])||0;
const ativos=()=>S.pessoas.filter(p=>p.ativo!==false);
function linhas(){const o=[];S.postos.forEach(p=>{if(!o.includes(p.linha))o.push(p.linha)});return o}
function mins(t){if(!t)return null;const[a,b]=t.split(":").map(Number);return a*60+(b||0)}
function horasIntervalo(a,b){
  if(a==null||b==null||b<=a)return 0;
  const la=mins(S.settings.almIni),lb=mins(S.settings.almFim);
  let m=b-a;if(la!=null&&lb!=null&&lb>la)m-=Math.max(0,Math.min(b,lb)-Math.max(a,la));
  return Math.max(0,m/60);
}
function turnoH(){return horasIntervalo(mins(S.settings.inicio),mins(S.settings.fim))}
function horasPessoa(pr){
  if(!pr||pr.st==="F"||pr.st==="J")return 0;
  if(pr.st==="A")return horasIntervalo(mins(pr.ent||S.settings.inicio),mins(pr.sai||S.settings.fim));
  return turnoH();
}
function newDay(date){
  const presenca={};ativos().forEach(p=>presenca[p.id]={st:"P"});
  return{data:date,presenca,producao:[],pins:[]};
}
function loadDay(date){
  flushDay();curDate=date;blocoSel=null;dayDirty=false;
  day=S.dias[date]?clone(S.dias[date]):newDay(date);
  ativos().forEach(p=>{if(!day.presenca[p.id])day.presenca[p.id]={st:"P"}});
  day.pins=day.pins||[];delete day.alocacao;
  day.producao=(day.producao||[]).map(it=>({id:it.id||uid("i"),prodId:it.prodId,qtd:it.qtd??null,ini:it.ini||S.settings.inicio,fim:it.fim||S.settings.fim}));
}
function presentes(){return ativos().filter(p=>horasPessoa(day.presenca[p.id])>0.01)}

function hhmm(m){return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")}
function itemWin(it){return[mins(it.ini||S.settings.inicio),mins(it.fim||S.settings.fim)]}
function presWin(pr){
  if(!pr||pr.st==="F"||pr.st==="J")return null;
  if(pr.st==="A")return[mins(pr.ent||S.settings.inicio),mins(pr.sai||S.settings.fim)];
  return[mins(S.settings.inicio),mins(S.settings.fim)];
}
/* Pessoas necessárias no posto durante a janela do item:
   com quantidade e tempo padrão = horas de trabalho ÷ horas da janela (arredonda para cima); sem tempo = 1 pessoa. */
function headcount(it,op){
  const t=Number(op.tempo),q=Number(it.qtd);
  if(t>0&&q>0){const[a,b]=itemWin(it);const h=horasIntervalo(a,b);if(h<=0)return 1;return Math.max(1,Math.ceil(q*t/60/h-1e-6))}
  return 1;
}
/* Divide o dia em blocos de horário: muda o bloco sempre que começa/termina um produto
   ou alguém chega/sai. Cada bloco tem sua própria escala. */
function segmentos(){
  const T0=mins(S.settings.inicio),T1=mins(S.settings.fim);
  const pts=new Set([T0,T1]);
  day.producao.forEach(it=>itemWin(it).forEach(x=>{if(x>T0&&x<T1)pts.add(x)}));
  ativos().forEach(p=>{const w=presWin(day.presenca[p.id]);if(w)w.forEach(x=>{if(x>T0&&x<T1)pts.add(x)})});
  const arr=[...pts].sort((a,b)=>a-b),segs=[];
  for(let i=0;i<arr.length-1;i++){
    const a=arr[i],b=arr[i+1];if(horasIntervalo(a,b)<=0.01)continue;
    const items=day.producao.filter(it=>{const[x,y]=itemWin(it);return x<=a&&y>=b&&produto(it.prodId)});
    if(items.length)segs.push({a,b,h:horasIntervalo(a,b),items});
  }
  return segs;
}
/* Monta a escala de cada bloco.
   Prioridade: (1) ajustes fixados pela líder; (2) cada pessoa no seu posto habitual (nível ≥ 50);
   (3) quem já estava no posto no bloco anterior continua (evita troca-troca);
   (4) preenche primeiro o posto com MENOS aptas (≥ 75) presentes e, no empate, usa a pessoa menos versátil
       (guarda as polivalentes para onde só elas servem);
   (5) troca: se sobrou posto vazio, libera uma apta colocando uma pessoa livre no lugar dela;
   (6) em último caso, nível 50 com acompanhamento. */
function escala(){
  const segs=segmentos();let prev=null;
  for(const s of segs){
    const need={},origem={};
    s.items.forEach(it=>{const pr=produto(it.prodId);(pr.ops||[]).forEach(op=>{if(!posto(op.postoId))return;
      need[op.postoId]=(need[op.postoId]||0)+headcount(it,op);(origem[op.postoId]=origem[op.postoId]||new Set()).add(pr.nome)})});
    const pres=ativos().filter(p=>{const w=presWin(day.presenca[p.id]);return w&&w[0]<=s.a&&w[1]>=s.b});
    const free=new Set(pres.map(p=>p.id)),rem={...need},as=[];
    const put=(k,pid,mot,de)=>{as.push({postoId:k,pid,mot,de});rem[k]--;free.delete(pid)};
    (day.pins||[]).filter(p=>p.ini<=s.a&&p.fim>=s.b&&rem[p.postoId]>0&&free.has(p.pid)).forEach(p=>put(p.postoId,p.pid,"fixado"));
    pres.forEach(p=>{const h=p.habitual;if(h&&free.has(p.id)&&rem[h]>0&&lvl(p,h)>=50)put(h,p.id,"habitual")});
    if(prev)prev.as.forEach(x=>{if(free.has(x.pid)&&rem[x.postoId]>0&&lvl(pessoa(x.pid),x.postoId)>=50)put(x.postoId,x.pid,x.mot==="fixado"?"continua":x.mot,x.de)});
    const fill=minLv=>{for(let g=0;g<400;g++){
      const open=Object.keys(rem).filter(k=>rem[k]>0);let best=null;
      for(const k of open){const c=pres.filter(p=>free.has(p.id)&&lvl(p,k)>=minLv);if(c.length&&(!best||c.length<best.c.length))best={k,c}}
      if(!best)return;
      const flex=p=>open.filter(o=>o!==best.k&&lvl(p,o)>=minLv).length;
      best.c.sort((a,b)=>lvl(b,best.k)-lvl(a,best.k)||flex(a)-flex(b));
      put(best.k,best.c[0].id,minLv>=75?"apta":"apoio50");
    }};
    const swap=minLv=>{
      for(const k of Object.keys(rem).filter(k=>rem[k]>0)){
        for(const x of as.slice()){
          if(!(rem[k]>0))break;if(x.mot==="fixado"||x.postoId===k)continue;
          const X=pessoa(x.pid);if(lvl(X,k)<minLv)continue;
          const Y=pres.find(p=>free.has(p.id)&&lvl(p,x.postoId)>=75);if(!Y)continue;
          free.delete(Y.id);const from=x.postoId;x.pid=Y.id;x.mot="liberou";x.para=X.id;
          as.push({postoId:k,pid:X.id,mot:"troca",de:from});rem[k]--;
        }
      }
    };
    fill(75);swap(75);fill(50);swap(50);
    Object.assign(s,{need,origem,pres,as,rem,idle:[...free]});
    prev=s;
  }
  return segs;
}
const MOT={fixado:"ajuste da líder",habitual:"posto habitual",continua:"continua do bloco anterior",apta:"apta livre",troca:"remanejada",liberou:"cobre quem foi remanejada",apoio50:"nível 50"};

/* ---------- Inteligência: alternativas para um posto num bloco ---------- */
function alternativas(s,k,exclude){
  const nm=id=>pessoa(id)?.nome||"?";
  const assigned=new Map(s.as.map(x=>[x.pid,x]));
  const idle=s.pres.filter(p=>!assigned.has(p.id)&&p.id!==exclude);
  const out=[];
  idle.filter(p=>lvl(p,k)>=75).forEach(p=>out.push({sc:300+lvl(p,k),lv:lvl(p,k),txt:`<b>${esc(p.nome)}</b> está livre e tem nível ${lvl(p,k)} neste posto.`,pins:[[k,p.id]],ok:true}));
  s.as.forEach(x=>{
    if(x.pid===exclude||x.postoId===k||x.mot==="fixado")return;
    const X=pessoa(x.pid),lx=lvl(X,k);if(lx<50)return;
    const j=x.postoId;
    const Ys=idle.filter(p=>lvl(p,j)>=50).sort((a,b)=>lvl(b,j)-lvl(a,j));
    const Y=Ys[0];
    if(!Y)return;
    const ly=lvl(Y,j),ok=lx>=75&&ly>=75;
    out.push({sc:(lx>=75?200:50)+(ly>=75?40:0)+lx/10,lv:lx,ok,
      txt:`Mova <b>${esc(X.nome)}</b> (nível ${lx}) de ${esc(nomePosto(j))} para cá, e <b>${esc(Y.nome)}</b> (nível ${ly}${ly<75?", com acompanhamento":""}) assume ${esc(nomePosto(j))}.`,
      pins:[[k,X.id],[j,Y.id]]});
  });
  idle.filter(p=>lvl(p,k)===50).forEach(p=>out.push({sc:100,lv:50,txt:`<b>${esc(p.nome)}</b> está livre e tem nível 50: pode assumir com acompanhamento da líder nas primeiras peças.`,pins:[[k,p.id]],ok:false}));
  const seen=new Set();
  return out.sort((a,b)=>b.sc-a.sc).filter(o=>{const key=o.pins.map(p=>p.join()).join("|");if(seen.has(key))return false;seen.add(key);return true}).slice(0,3);
}
/* Plano B: se ninguém pode cobrir, sugere produto da mesma família que não use o posto e que tenha gente apta presente */
function planoB(s,k){
  const deps=s.items.filter(it=>(produto(it.prodId).ops||[]).some(o=>o.postoId===k)).map(it=>produto(it.prodId));
  const fams=new Set(deps.map(p=>p.familia));
  const ativosNoBloco=new Set(s.items.map(it=>it.prodId));
  const alt=S.produtos.filter(p=>fams.has(p.familia)&&!ativosNoBloco.has(p.id)&&(p.ops||[]).length&&!(p.ops||[]).some(o=>o.postoId===k)
    &&(p.ops||[]).every(o=>s.pres.some(x=>lvl(x,o.postoId)>=75))).slice(0,2);
  return{deps,alt};
}
/* Agrupa blocos seguidos com a mesma situação num posto (para não repetir a orientação) */
function situacaoPosto(segs,k,exclude){
  const rows=[];
  segs.forEach(s=>{
    if(s.need[k]==null)return;
    const cov=s.as.filter(x=>x.postoId===k).map(x=>x.pid);
    const key=cov.join(",")+"|"+s.rem[k];
    const last=rows[rows.length-1];
    if(last&&last.key===key&&last.b===s.a){last.b=s.b;last.segs.push(s)}
    else rows.push({key,a:s.a,b:s.b,cov,falta:Math.max(0,s.rem[k]),segs:[s]});
  });
  return rows;
}
function orientacoes(segs){
  const cards=[];const tratados=new Set();
  const T0=mins(S.settings.inicio),T1=mins(S.settings.fim);
  ativos().forEach(p=>{
    const pr=day.presenca[p.id]||{st:"P"};if(pr.st==="P")return;
    const w=presWin(pr);
    let quando=pr.st==="F"?"faltou":pr.st==="J"?"faltou (justificada)":"";
    if(pr.st==="A"){const parts=[];if(w&&w[0]>T0)parts.push("chega às "+hhmm(w[0]));if(w&&w[1]<T1)parts.push("sai às "+hhmm(w[1]));quando=parts.join(" e ")||"parcial"}
    const k=p.habitual;
    const rows=k?situacaoPosto(segs,k).filter(r=>!r.cov.includes(p.id)):[];
    if(k)tratados.add(k);
    cards.push({tipo:"pessoa",p,quando,k,rows});
  });
  // postos com problema que não são de ninguém ausente
  const probs=new Map();
  segs.forEach(s=>Object.keys(s.need).forEach(k=>{
    if(tratados.has(k))return;
    const fraco=s.as.filter(x=>x.postoId===k).some(x=>lvl(pessoa(x.pid),k)<75);
    if(s.rem[k]>0||fraco)probs.set(k,true);
  }));
  [...probs.keys()].forEach(k=>cards.push({tipo:"posto",k,rows:situacaoPosto(segs,k).filter(r=>r.falta>0||r.cov.some(pid=>lvl(pessoa(pid),k)<75))}));
  return cards;
}

/* ============================ TAKT, BALANCEAMENTO E GARGALO ============================
   Takt = minutos disponíveis na janela ÷ quantidade pedida.
   Ciclo efetivo do posto = tempo padrão ÷ pessoas no posto.
   Gargalo = posto com maior ciclo efetivo; capacidade = minutos disponíveis ÷ ciclo do gargalo.
   Eficiência de balanceamento = Σ tempos ÷ (Σ pessoas × ciclo do gargalo). */
const fmtN=(v,d=2)=>v==null||!isFinite(v)?"—":Number(v).toLocaleString("pt-BR",{maximumFractionDigits:d});
const fmtMin=v=>fmtN(v,2)+" min";
const fmtPes=v=>fmtN(v,1);
function resumoRitmo(rows,avail,q){
  const takt=q>0&&avail>0?avail/q:null;
  const comT=rows.filter(r=>r.tempo);
  const parados=comT.filter(r=>r.parado);
  const ativos_=comT.filter(r=>!r.parado&&r.ciclo);
  const g=parados[0]||ativos_.reduce((m,r)=>!m||r.ciclo>m.ciclo?r:m,null);
  if(g)g.gargalo=true;
  const cap=!g?null:g.parado?0:Math.floor(avail/g.ciclo+1e-6);
  const sumT=comT.reduce((s,r)=>s+r.tempo,0),sumP=ativos_.reduce((s,r)=>s+r.pessoas,0);
  const efic=g&&!g.parado&&sumP>0?ativos_.reduce((s,r)=>s+r.tempo,0)/(sumP*g.ciclo):null;
  const nop=takt&&sumT?sumT/takt:null;
  return{takt,g,cap,sumT,sumP,efic,nop,semTempo:rows.length-comT.length,total:rows.length,avail,q};
}
/* Dia: usa quem a escala realmente colocou em cada posto durante a janela do produto */
function ritmoItem(it,segs){
  const p=produto(it.prodId);if(!p)return null;
  const[a,b]=itemWin(it);const avail=horasIntervalo(a,b)*60;const q=Number(it.qtd)||0;
  const ss=segs.filter(s=>s.items.includes(it));
  const rows=(p.ops||[]).filter(o=>posto(o.postoId)).map(o=>{
    const k=o.postoId,t=Number(o.tempo)>0?Number(o.tempo):null,hc=headcount(it,o);
    let pes=hc,lv50=false;
    if(ss.length)pes=Math.min(...ss.map(s=>{const as=s.as.filter(x=>x.postoId===k);if(as.some(x=>lvl(pessoa(x.pid),k)<75))lv50=true;return as.length*hc/(s.need[k]||1)}));
    return{k,nome:nomePosto(k),curto:posto(k).nome,tempo:t,nec:hc,pessoas:pes,ciclo:t&&pes>0.001?t/pes:null,parado:!!t&&pes<=0.001,lv50};
  });
  return{it,p,a,b,rows,r:resumoRitmo(rows,avail,q)};
}
/* Produtos: simulação com demanda e horas informadas; pessoas = mínimo para caber no takt */
function ritmoSim(p,q,h){
  const avail=h*60,takt=q>0&&avail>0?avail/q:null;
  const rows=(p.ops||[]).filter(o=>posto(o.postoId)).map(o=>{
    const k=o.postoId,t=Number(o.tempo)>0?Number(o.tempo):null;
    const nec=t&&takt?Math.max(1,Math.ceil(t/takt-1e-6)):1;
    const pes=simModo==="bruto"?1:nec;
    const apt=ativos().filter(x=>lvl(x,k)>=75).length;
    return{k,nome:nomePosto(k),curto:posto(k).nome,tempo:t,nec,pessoas:pes,ciclo:t?t/pes:null,parado:false,apt,lv50:apt<nec};
  });
  return{rows,r:resumoRitmo(rows,avail,q)};
}
function yamazumiSVG(rows,takt,titulo){

    if(!r.tempo){mark=`<line x1="${x}" x2="${x+bw}" y1="${y0-1}" y2="${y0-1}" stroke="var(--muted)" stroke-width="2" stroke-dasharray="3 3"/>`;val=`<text x="${cx}" y="${y0-8}" font-size="11" text-anchor="middle" fill="var(--muted)">sem tempo</text>`}
    else if(r.parado){const yt=y(r.tempo);mark=`<rect class="bm" x="${x}" y="${yt}" width="${bw}" height="${y0-yt}" rx="4" fill="url(#yzHatch)" stroke="var(--stitch)" stroke-width="1.5" stroke-dasharray="4 3"/>`;val=`<text x="${cx}" y="${yt-6}" font-size="11" font-weight="700" text-anchor="middle" fill="var(--ink)">sem pessoa</text>`}
    else{
      const yt=y(r.ciclo),h=y0-yt,rr=Math.min(4,h,bw/2);

      mark=`<path class="bm" d="M${x},${y0}V${yt+rr}Q${x},${yt} ${x+rr},${yt}H${x+bw-rr}Q${x+bw},${yt} ${x+bw},${yt+rr}V${y0}Z" fill="${fill}"/>`;
      if(r.gargalo||over)val=h>20?`<text x="${cx}" y="${yt+14}" font-size="11" font-weight="700" text-anchor="middle" fill="var(--card)">${fmtN(r.ciclo,2)}</text>`:`<text x="${cx}" y="${yt-6}" font-size="11" font-weight="700" text-anchor="middle" fill="var(--ink)" class="halo">${fmtN(r.ciclo,2)}</text>`;
      if(r.gargalo)val+=`<text x="${cx}" y="${yt-(h>20?7:19)}" font-size="10.5" font-weight="700" text-anchor="middle" fill="var(--stitch)" class="halo">gargalo</text>`;

    g+=`<g class="col" data-tip="${tip}"><rect x="${L+slot*i}" y="${T}" width="${slot}" height="${PH+B}" fill="transparent"/>${mark}${val}${pes}
      <text transform="translate(${cx+3},${y0+26}) rotate(-38)" font-size="11" text-anchor="end" fill="var(--ink)">${esc(lab)}</text></g>`;
  });

  if(takt){const yt=y(takt);g+=`<line x1="${L}" x2="${W-R}" y1="${yt}" y2="${yt}" stroke="var(--ink)" stroke-width="2" stroke-dasharray="7 5"/><text x="${W-R+6}" y="${yt-3}" font-size="12" font-weight="700" fill="var(--ink)" class="halo">takt</text><text x="${W-R+6}" y="${yt+11}" font-size="11.5" fill="var(--ink)">${fmtMin(takt)}</text>`}
  return `<div class="yzchart"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(titulo)}">
    <defs><pattern id="yzHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="var(--stitch-soft)"/><line x1="0" y1="0" x2="0" y2="7" stroke="var(--stitch)" stroke-width="2"/></pattern></defs>${g}</svg></div>`;
}
function yamazumiTabela(rows,takt,sim){

function kpisRitmo(r,sim){

}
function msgRitmo(r){

/* ============================ GD — GERENCIAMENTO DIÁRIO (modelo A3 da fábrica) ============================

const AREAS_APOIO=["Corte","Silk","Arremate / Desviragem"];
const ST_ACAO=["Aberta","Em andamento","Escalada","Concluída"];

let gdHoraL=null;
function linhasProd(){return linhas().filter(l=>l!=="Apoio")}
function gdOf(d){d.gd=d.gd||{};const g=d.gd;g.real=g.real||{};g.obs=g.obs||{};g.hora=g.hora||{};g.q=g.q||{};g.apoio=g.apoio||{};g.restr=g.restr||[];return g}
function metasLinha(d){
  const m={},p={};
  (d.producao||[]).forEach(it=>{const pr=produto(it.prodId);if(!pr)return;const L=pr.familia||"Sem linha";m[L]=(m[L]||0)+(Number(it.qtd)||0);(p[L]=p[L]||[]).push(pr.nome.replace(/\s*—\s*linha completa$/i,""))});

}
function linhasGD(d){const {m}=metasLinha(d);const out=linhasProd();Object.keys(m).forEach(L=>{if(!out.includes(L)&&L!=="Apoio")out.push(L)});return out}
function slotsHora(){const a=mins(S.settings.inicio),b=mins(S.settings.fim),out=[];for(let t=a;t<b;t+=60){const e=Math.min(b,t+60),h=horasIntervalo(t,e);if(h>0.01)out.push({a:t,b:e,h})}return out}
const numOrNull=v=>v===""||v==null||isNaN(Number(v))?null:Number(v);
function somaHora(d,L){const hr=gdOf(d).hora[L];if(!hr)return null;const v=Object.values(hr).map(numOrNull).filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b,0):null}
function realLinha(d,L){const g=gdOf(d),r=numOrNull(g.real[L]);return r!=null?r:somaHora(d,L)}
/* meta de comparação: dia inteiro quando o realizado foi digitado; meta acumulada até a última hora lançada quando vem do hora a hora */
function metaRef(d,L){const g=gdOf(d),mt=metasLinha(d).m[L]||0;if(numOrNull(g.real[L])!=null)return{meta:mt,ate:null};
  const hr=g.hora[L];if(!hr)return{meta:mt,ate:null};const idx=Object.keys(hr).filter(k=>numOrNull(hr[k])!=null).map(Number);if(!idx.length)return{meta:mt,ate:null};
  const sl=slotsHora(),tot=sl.reduce((a,x)=>a+x.h,0),last=Math.max(...idx);let acc=0;for(let i=0;i<=last&&i<sl.length;i++)acc+=tot?mt*sl[i].h/tot:0;return{meta:acc,ate:sl[Math.min(last,sl.length-1)]?hhmm(sl[Math.min(last,sl.length-1)].b):null}}
function farol(real,meta){if(real==null||!meta)return null;const p=real/meta*100;return p>=Number(S.settings.gdVerde??100)?"ok":p>=Number(S.settings.gdAmarelo??90)?"amb":"red"}
const FAROL_TXT={ok:"Dentro do plano",amb:"Atenção",red:"Desvio"};
function totaisGD(d){
  const {m}=metasLinha(d);let meta=0,real=0,ref=0,temReal=false,parcial=false;
  linhasGD(d).forEach(L=>{meta+=m[L]||0;const r=realLinha(d,L);if(r!=null){real+=r;temReal=true;const mr=metaRef(d,L);ref+=mr.meta;if(mr.ate)parcial=true}});
  return{meta,real:temReal?real:null,ref,ating:temReal&&ref?real/ref:null,parcial};
}
function gdPessoas(segs){
  const at=ativos();
  const aus=at.filter(p=>["F","J"].includes(day.presenca[p.id]?.st));
  const parc=at.filter(p=>day.presenca[p.id]?.st==="A");
  const rem=new Set(),desc=new Set(),fraco=new Map();
  segs.forEach(s=>{
    Object.keys(s.rem).forEach(k=>{if(s.rem[k]>0)desc.add(k)});
    s.as.forEach(x=>{const p=pessoa(x.pid);if(!p)return;if(p.habitual&&p.habitual!==x.postoId)rem.add(x.pid);if(lvl(p,x.postoId)<75)fraco.set(x.postoId,p.nome)});
  });
  const treino=[];S.postos.forEach(q=>{const ap=at.filter(p=>lvl(p,q.id)>=75).length;if(ap<(q.meta??2)&&segs.some(s=>s.need[q.id]!=null)){const f=at.filter(p=>lvl(p,q.id)===50).map(p=>p.nome);treino.push(`${nomePosto(q.id)}${f.length?": treinar "+f.slice(0,2).join(" ou "):""}`)}});
  return{pres:presentes().length,total:at.length,aus:aus.length,parc:parc.length,ausNomes:aus.map(p=>p.nome),rem:rem.size,
    desc:[...desc].map(nomePosto),fraco:[...fraco].map(([k,n])=>`${nomePosto(k)} (${n}, nível 50)`),treino};
}
const acaoVencida=a=>a.status!=="Concluída"&&a.prazo&&a.prazo<todayISO();
function acoesAbertas(){return(S.acoes||[]).filter(a=>a.status!=="Concluída").sort((a,b)=>(acaoVencida(b)-acaoVencida(a))||String(a.prazo||"9").localeCompare(String(b.prazo||"9")))}
function semanaDe(iso){const d=new Date(iso+"T12:00:00"),w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return[0,1,2,3,4].map(i=>{const x=new Date(d);x.setDate(d.getDate()+i);return x.toISOString().slice(0,10)})}
function diaSemana(iso){if(iso===curDate)return day;return S.dias[iso]?clone(S.dias[iso]):null}
function diaAnterior(){const ks=Object.keys(S.dias).filter(k=>k<curDate).sort();return ks.length?clone(S.dias[ks[ks.length-1]]):null}

  if(reu.i===3){const ab=acoesAbertas();body=ab.length?`<table class="gdt big"><thead><tr><th>Ação</th><th>Responsável</th><th>Prazo</th><th>Status</th></tr></thead><tbody>${ab.map(a=>`<tr class="${acaoVencida(a)?"venc":""}"><td><b>${esc(a.acao||a.prob||"—")}</b>${a.prob&&a.acao?`<br><span class="small muted">${esc(a.prob)}</span>`:""}</td><td>${esc(a.resp||"—")}</td><td>${a.prazo?fmtDate(a.prazo):"—"}${acaoVencida(a)?` <span class="tag red">vencida</span>`:""}</td><td>${esc(a.status)}</td></tr>`).join("")}</tbody></table>
    <p class="small muted" style="margin-top:8px">Ação vencida: decida na hora se ganha novo prazo ou se escala para a direção.</p>`:`<p class="muted">Nenhuma ação aberta.</p>`}
  const root=document.getElementById("modalRoot");

    <div class="reutop"><span class="small muted">Reunião diária · ${fmtDate(curDate)}</span><span class="reutime" id="reuT">10:00</span></div>

    <h3 style="font-size:24px;margin:10px 0 2px">${reu.i+1}. ${PASSOS[reu.i][0]}</h3><p class="small muted" style="margin:0 0 8px">Tempo sugerido: ${PASSOS[reu.i][1]}</p>
    <div class="reubody">${body}</div>
    <div class="row" style="justify-content:space-between;margin-top:14px"><button class="btn" data-r="close">Encerrar</button>
    <span class="row">${reu.i>0?`<button class="btn" data-r="${reu.i-1}">Voltar</button>`:""}${reu.i<3?`<button class="btn primary" data-r="${reu.i+1}">Próximo</button>`:`<button class="btn primary" data-r="close">Concluir reunião</button>`}</span></div></div></div>`;
  root.onclick=e=>{const b=e.target.closest("[data-r]");if(!b){if(e.target.classList.contains("modal-bg"))fecharReu();return}if(b.dataset.r==="close"){fecharReu();if(reu==null&&b.textContent.includes("Concluir"))toast("Reunião concluída.");return}reuniao(Number(b.dataset.r))};
  clearInterval(reuniao._t);
  const tick=()=>{const el=document.getElementById("reuT");if(!el||!reu){clearInterval(reuniao._t);return}const s=Math.round(600-(Date.now()-reu.t0)/1000),a=Math.abs(s);el.textContent=(s<0?"−":"")+Math.floor(a/60)+":"+String(a%60).padStart(2,"0");el.classList.toggle("over",s<0)};
  tick();reuniao._t=setInterval(tick,1000);
}

/* ============================ SAÚDE DA MATRIZ ============================ */
function saudeMatriz(){
  const at=ativos(),out=[];
  const usados=new Set(S.produtos.flatMap(p=>(p.ops||[]).map(o=>o.postoId)));
  const nomes=a=>{const n=a.map(p=>esc(p.nome));return n.length>1?n.slice(0,-1).join(", ")+" e "+n[n.length-1]:n.join("")};
  at.forEach(p=>{
    if(p.habitual&&!posto(p.habitual))out.push({sev:"red",g:"Posto habitual",txt:`<b>${esc(p.nome)}</b>: o posto habitual cadastrado não existe mais.`,sub:"Escolha outro posto habitual.",id:p.id});
    else if(p.habitual&&lvl(p,p.habitual)<50)out.push({sev:"red",g:"Posto habitual",txt:`<b>${esc(p.nome)}</b> tem posto habitual <b>${esc(nomePosto(p.habitual))}</b>, mas está com nível ${lvl(p,p.habitual)} nele.`,sub:"A escala só coloca alguém no posto habitual com nível 50 ou mais. Corrija o posto habitual ou o nível na matriz.",id:p.id});
  });
  const hab={};at.forEach(p=>{if(p.habitual&&posto(p.habitual))(hab[p.habitual]=hab[p.habitual]||[]).push(p)});
  Object.entries(hab).filter(([,v])=>v.length>1).forEach(([k,v])=>out.push({sev:"info",g:"Posto habitual",txt:`${nomes(v)} têm o mesmo posto habitual (${esc(nomePosto(k))}).`,sub:"Sem tempo padrão o posto pede 1 pessoa: as demais vão para outro posto ou ficam livres."}));
  S.postos.forEach(q=>{
    const ap=at.filter(p=>lvl(p,q.id)>=75),f50=at.filter(p=>lvl(p,q.id)===50),meta=q.meta??2,uso=usados.has(q.id);
    const form=f50.length?`Em formação (nível 50): ${nomes(f50)}.`:"Ninguém com nível 50: escolha quem começar a treinar.";
    if(!ap.length)out.push({sev:uso?"red":"amb",g:"Cobertura dos postos",txt:`<b>${esc(nomePosto(q.id))}</b>: nenhuma pessoa apta (75 ou mais).${uso?" Sempre que este posto estiver no plano, fica descoberto ou com nível 50.":" Não está em nenhum roteiro de produto."}`,sub:form});
    else if(ap.length===1&&meta>1)out.push({sev:"amb",g:"Cobertura dos postos",txt:`<b>${esc(nomePosto(q.id))}</b> depende só de <b>${esc(ap[0].nome)}</b>. Numa falta, o posto fica sem pessoa apta.`,sub:form});
    else if(ap.length<meta)out.push({sev:"info",g:"Cobertura dos postos",txt:`<b>${esc(nomePosto(q.id))}</b>: ${ap.length} aptas para meta de ${meta}.`,sub:form});
  });
  at.forEach(p=>{if(!S.postos.some(q=>lvl(p,q.id)>=75))out.push({sev:"amb",g:"Pessoas",txt:`<b>${esc(p.nome)}</b> não é apta (75 ou mais) em nenhum posto.`,sub:"Na escala ela só entra com nível 50 e acompanhamento, ou fica de apoio.",id:p.id})});
  const vol=at.filter(p=>!p.habitual);
  if(vol.length)out.push({sev:"info",g:"Pessoas",txt:`${vol.length} pessoa(s) sem posto habitual (volantes): ${nomes(vol)}.`,sub:"A escala usa essas pessoas onde faltar gente. Se alguma tem posto fixo, cadastre o habitual."});
  const st=S.produtos.filter(p=>(p.ops||[]).length&&(p.ops||[]).some(o=>!(Number(o.tempo)>0)));
  if(st.length)out.push({sev:"info",g:"Produtos",txt:`${st.length} de ${S.produtos.length} produto(s) sem tempo padrão em algum posto: ${esc(st.slice(0,4).map(p=>p.nome).join(", "))}${st.length>4?"…":""}.`,sub:"Sem o tempo, cada posto pede 1 pessoa e não dá para calcular takt, Yamazumi nem gargalo.",prod:st[0].id});
  const vazio=S.produtos.filter(p=>!(p.ops||[]).length);
  if(vazio.length)out.push({sev:"amb",g:"Produtos",txt:`${vazio.length} produto(s) sem nenhum posto no roteiro: ${esc(vazio.map(p=>p.nome).join(", "))}.`,sub:"Esses produtos não geram escala.",prod:vazio[0].id});
  return out;
}
function saudeHtml(){
  const it=saudeMatriz(),c={red:0,amb:0,info:0};it.forEach(x=>c[x.sev]++);
  const worst=c.red?"red":c.amb?"amb":"";
  if(!it.length)return `<div class="card saude" id="saude"><h3 style="font-size:20px;display:flex;gap:10px;align-items:center"><span class="pico sm">${ic("alfineteira")}</span>Saúde da matriz</h3><p class="small" style="margin:4px 0 0">Nenhuma inconsistência: todos os postos têm pessoas aptas na meta e os postos habituais batem com a matriz.</p></div>`;
  const open=saudeOpen==null?!!c.red:saudeOpen;
  const L={red:"Crítico",amb:"Atenção",info:"Aviso"},ord={red:0,amb:1,info:2};
  const grupos=["Posto habitual","Cobertura dos postos","Pessoas","Produtos"];
  let h=`<details class="card saude ${worst}" id="saude" ${open?"open":""}><summary><h3><span class="pico sm">${ic("alfineteira")}</span>Saúde da matriz</h3>
    ${c.red?`<span class="tag red">${c.red} crítico${c.red>1?"s":""}</span>`:""}${c.amb?`<span class="tag amb">${c.amb} atenção</span>`:""}${c.info?`<span class="tag info">${c.info} aviso${c.info>1?"s":""}</span>`:""}<span class="chev">${ic("chev")}</span></summary>
    <p class="small muted" style="margin:6px 0 0">Verificação automática da matriz, dos postos habituais e dos roteiros. Atualiza a cada mudança.</p>`;
  grupos.forEach(g=>{const xs=it.filter(x=>x.g===g).sort((a,b)=>ord[a.sev]-ord[b.sev]);if(!xs.length)return;
    h+=`<div class="hgrp">${g}</div>`+xs.map(x=>`<div class="hitem"><span class="tag ${x.sev==="info"?"info":x.sev}">${L[x.sev]}</span><div class="tx">${x.txt}<small>${x.sub||""}</small></div>${x.id?`<button class="btn sm" data-act="editPessoa" data-id="${x.id}">Editar pessoa</button>`:x.prod?`<button class="btn sm" data-act="goProd" data-id="${x.prod}">Abrir produto</button>`:""}</div>`).join("")});
  return h+`</details>`;
}

function viewDia(){
  const segs=escala();
  const pres=presentes(),T=turnoH();
  const faltas=ativos().filter(p=>["F","J"].includes(day.presenca[p.id]?.st)).length;
  const parciais=ativos().filter(p=>day.presenca[p.id]?.st==="A").length;
  const pico=segs.reduce((m,s)=>Math.max(m,Object.values(s.need).reduce((a,b)=>a+b,0)),0);
  const desc=segs.reduce((m,s)=>m+Object.values(s.rem).filter(v=>v>0).reduce((a,b)=>a+b,0),0);
  const saved=!!S.dias[curDate];
  let h=`<div class="daybar">
    <label class="row small"><span class="muted">Data</span><input type="date" id="dateIn" value="${curDate}"></label>
    <span class="small muted">${saved?"Dia registrado":"Dia ainda não registrado"} · turno ${S.settings.inicio}–${S.settings.fim} (${fmtH(T)})</span>
    <div class="kpis">
      <div class="kpi good"><b>${pres.length}</b><span>presentes</span></div>
      <div class="kpi ${faltas?"bad":""}"><b>${faltas}</b><span>faltas</span></div>
      <div class="kpi"><b>${parciais}</b><span>parciais</span></div>
      <div class="kpi ${pico>pres.length?"bad":""}"><b>${pico}</b><span>pessoas no pico</span></div>
    </div></div>`;
  h+=`<div class="steps">
    <details class="card step" data-step="s1" ${openSteps.s1?"open":""}><summary><h2>${passo(1,"cabide","Quem veio hoje")}<span class="chev">${ic("chev")}</span></h2><div class="sumline">${pres.length} presentes · ${faltas} falta(s) · ${parciais} parcial(is) — toque para editar</div></summary>
      <div class="row small" style="margin-bottom:8px"><button class="btn sm" data-act="allP">Todas presentes</button><span class="muted">Parcial = chegou mais tarde ou saiu mais cedo.</span></div>
      <div class="plist">${ativos().map(rowPresenca).join("")}</div></details>
    <details class="card step" data-step="s2" ${openSteps.s2||!day.producao.length?"open":""}><summary><h2>${passo(2,"carretel","O que será produzido, e quando")}<span class="chev">${ic("chev")}</span></h2><div class="sumline">${day.producao.length?esc(day.producao.map(it=>(produto(it.prodId)?.nome||"?")+" "+(it.ini||S.settings.inicio)+"–"+(it.fim||S.settings.fim)).join(" · ")):"Nenhum produto ainda"}</div></summary>
      <div class="prod-add"><select id="prodSel" aria-label="Produto"><option value="">Escolha o produto…</option>${grpProdOptions()}</select>
        <input type="number" id="prodQtd" min="0" placeholder="Qtd" aria-label="Quantidade"><button class="btn primary" data-act="addProd">Adicionar</button></div>
      <p class="small muted" style="margin:6px 0 0">Informe o horário de cada produto. Quando a linha troca de modelo, adicione o próximo com o novo horário: a escala muda naquela hora. Com quantidade e tempo padrão, o app calcula quantas pessoas cada posto precisa.</p>
      <div>${day.producao.map((it,i)=>{const p=produto(it.prodId);const hc=p?(p.ops||[]).reduce((s,o)=>s+headcount(it,o),0):0;
        return `<div class="pitem" style="flex-wrap:wrap"><div class="nm"><b>${esc(p?p.nome:"Produto removido")}</b><small>${esc(p?p.familia:"")} · ${p?(p.ops||[]).length:0} postos · ${hc} pessoas</small></div>
        <span class="row small" style="gap:4px"><input type="time" value="${it.ini||S.settings.inicio}" data-act="itField" data-f="ini" data-i="${i}" aria-label="Início">–<input type="time" value="${it.fim||S.settings.fim}" data-act="itField" data-f="fim" data-i="${i}" aria-label="Fim"></span>
        <input type="number" min="0" value="${it.qtd??""}" placeholder="Qtd" data-act="itField" data-f="qtd" data-i="${i}" aria-label="Quantidade" style="width:80px">
        <button class="btn sm danger" data-act="rmProd" data-i="${i}">Remover</button></div>`}).join("")||`<p class="muted small">Nenhum produto no plano de hoje.</p>`}</div>
    </details></div>`;
  if(!day.producao.length)return h+`<section class="card" style="margin-top:16px"><p class="muted">Adicione os produtos do dia no passo 2. A escala e as orientações aparecem aqui automaticamente.</p></section>`;
  if(!segs.length)return h+`<section class="card" style="margin-top:16px"><p class="muted">Os produtos escolhidos não têm postos no roteiro ou estão fora do turno. Confira a aba Produtos e os horários.</p></section>`;
  h+=viewOrientacao(segs);
  if(blocoSel==null||blocoSel>=segs.length){blocoSel="all";if(curDate===todayISO()&&window.innerWidth<=760){const n=new Date(),m=n.getHours()*60+n.getMinutes();const i=segs.findIndex(s=>s.a<=m&&s.b>m);if(i>=0)blocoSel=i}}
  const env=(day.envios||[]).slice(-1)[0];
  h+=`<section class="card" style="margin-top:16px"><div class="row escbar"><h2 class="sh" style="flex:1">${passo(4,"maquina","Escala do dia")}</h2>
