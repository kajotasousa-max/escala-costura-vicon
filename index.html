  if(escView==="hora"&&segs.length>1){
    h+=`<div class="blocks" role="group" aria-label="Horários"><button aria-pressed="${blocoSel==="all"}" data-act="bloco" data-v="all">Dia todo</button>${segs.map((s,i)=>{const f=Object.values(s.rem).some(v=>v>0),w=s.as.some(x=>lvl(pessoa(x.pid),x.postoId)<75);
      return `<button aria-pressed="${blocoSel===i}" data-act="bloco" data-v="${i}">${hhmm(s.a)}–${hhmm(s.b)}<span class="dot ${f?"bad":w?"amb":""}"></span></button>`}).join("")}</div>`;
  }
  h+=escView==="pessoa"?viewPorPessoa(segs):segs.filter((s,i)=>blocoSel==="all"||blocoSel===i).map(viewBloco).join("");
  h+=`</section>`;
  h+=viewRitmo(segs);
  h+=`<div class="actionbar"><button class="btn primary" data-act="email">${ic("envelope")}Enviar relatório</button><button class="btn" data-act="whats">${ic("conversa")}Texto p/ grupo</button></div>`;
  return h;
}
function viewOrientacao(segs){
  const cards=orientacoes(segs);
  let h=`<section class="card" style="margin-top:16px;border-left:6px solid var(--chalk)"><h2 class="sh">${passo(3,"agulha","O que fazer hoje")}</h2>
  <p class="small muted" style="margin:4px 0 10px">Para cada falta ou atraso, o app mostra quem assume o posto e por quê. Se houver opção melhor, toque em <b>Aplicar</b> e a escala muda na hora.</p>`;
  if(!cards.length)return h+`<div class="alert blue">Sem faltas, atrasos ou postos descobertos: siga a escala abaixo.</div></section>`;
  const render1=c=>{
    let head,sub;
    if(c.tipo==="pessoa"){
      head=`${esc(c.p.nome)} ${esc(c.quando)}`;
      if(!c.k)sub=`Sem posto habitual cadastrado. Não há substituição a fazer.`;
      else if(!c.rows.length)sub=`Posto habitual: ${esc(nomePosto(c.k))}. Esse posto não está no plano ${c.quando.includes("faltou")?"de hoje":"nesse horário"}, então não há substituição a fazer.`;
      else sub=`Posto habitual: <b>${esc(nomePosto(c.k))}</b>`;
    }else{head=`${esc(nomePosto(c.k))}: sem pessoa apta no plano`;sub=`Não há pessoa presente com nível 75 ou mais para este posto no horário indicado.`}
    const worst=c.rows.some(r=>r.falta>0)?"red":c.rows.some(r=>r.cov.some(pid=>lvl(pessoa(pid),c.k)<75))?"amb":"ok";
    return `<div class="guide ${worst}"><div class="gh"><b>${head}</b><span class="tag ${worst}">${worst==="red"?"Descoberto":worst==="amb"?"Atenção":"Resolvido"}</span></div><p class="small" style="margin:2px 0 6px">${sub}</p>
    ${c.rows.map(r=>rowGuia(c.k,r)).join("")}</div>`;
  };
  const sev=c=>c.rows.some(r=>r.falta>0)?2:c.rows.some(r=>r.cov.some(pid=>lvl(pessoa(pid),c.k)<75))?1:0;
  const pessoasC=cards.filter(c=>c.tipo==="pessoa"),cron=cards.filter(c=>c.tipo==="posto");
  const cronRed=cron.filter(c=>sev(c)===2),cronAmb=cron.filter(c=>sev(c)<2);
  if(pessoasC.length)h+=`<h3 style="font-size:18px;margin-top:6px">Faltas e atrasos</h3>`+pessoasC.map(render1).join("");
  if(cronRed.length)h+=`<h3 style="font-size:18px;margin-top:14px">Postos descobertos por falta de gente apta na matriz</h3>`+cronRed.map(render1).join("");
  if(cronAmb.length)h+=`<details style="margin-top:12px"><summary class="small" style="cursor:pointer;font-weight:600">${cronAmb.length} posto(s) operando com nível 50 todos os dias — ver orientação</summary>${cronAmb.map(render1).join("")}</details>`;
  return h+`</section>`;
}
function rowGuia(k,r){
  const s=r.segs[0],range=`${hhmm(r.a)}–${hhmm(r.b)}`;
  let h=`<div class="grow"><div class="gtime">${range}</div><div class="gbody">`;
  const nm=id=>esc(pessoa(id)?.nome||"?");
  if(r.cov.length){
    h+=r.cov.map(pid=>{const l=lvl(pessoa(pid),k);const x=s.as.find(y=>y.pid===pid&&y.postoId===k);
      let why="";
      if(x.mot==="troca"){const lib=s.as.find(y=>y.mot==="liberou"&&y.para===pid);why=`saiu de ${esc(nomePosto(x.de))}${lib?` e ${nm(lib.pid)} assumiu lá`:""}`}
      else why=MOT[x.mot]||"";
      return `<div><span class="lv lv${l}">${l}</span> <b>${nm(pid)}</b> assume <span class="muted">· ${why}</span>${l<75?` — <span style="color:var(--warn)">acompanhe as primeiras peças e confira a qualidade</span>`:""}</div>`}).join("");
  }
  if(r.falta>0)h+=`<div style="color:var(--stitch);font-weight:600">Falta${r.falta>1?"m":""} ${r.falta} pessoa${r.falta>1?"s":""} neste posto.</div>`;
  const precisa=r.falta>0||r.cov.some(pid=>lvl(pessoa(pid),k)<75);
  if(precisa){
    const exclude=r.cov.find(pid=>lvl(pessoa(pid),k)<75);
    const curLv=exclude?lvl(pessoa(exclude),k):-1;
    const alts=alternativas(s,k,exclude).filter(o=>r.falta>0||o.lv>curLv);
    if(alts.length)h+=`<div class="alts"><span class="small muted">${r.falta>0?"Como cobrir:":"Opção melhor:"}</span>${alts.map(o=>`<div class="alt"><span>${o.txt}</span><button class="btn sm ${o.ok?"primary":""}" data-act="aplicar" data-a="${r.a}" data-b="${r.b}" data-pins='${esc(JSON.stringify(o.pins))}'>Aplicar</button></div>`).join("")}</div>`;
    if(r.falta>0){
      const pb=planoB(s,k);
      h+=`<div class="alts"><span class="small muted">Se ninguém puder assumir:</span><ul class="small" style="margin:4px 0 0;padding-left:18px">
        ${pb.alt.map(p=>`<li>Troque a sequência: produza <b>${esc(p.nome)}</b> neste horário (não passa por ${esc(nomePosto(k))} e há gente apta presente) e deixe ${esc(pb.deps.map(d=>d.nome).join(", "))} para depois.</li>`).join("")}
        <li>A líder ou uma auxiliar cobre o posto com conferência de qualidade.</li>
        <li>Reduza a quantidade de ${esc(pb.deps.map(d=>d.nome).join(", "))} hoje e avise o PCP sobre o impacto na entrega.</li></ul></div>`;
    }
  }
  return h+`</div></div>`;
}
function viewBloco(s){
  const nm=id=>pessoa(id)?.nome||"?";
  const prods=[...new Set(s.items.map(it=>produto(it.prodId).nome))];
  const falta=Object.values(s.rem).filter(v=>v>0).reduce((a,b)=>a+b,0);
  let h=`<div class="bloco"><div class="bh"><b>${hhmm(s.a)}–${hhmm(s.b)}</b><span>${esc(prods.join(" + "))}</span><span class="muted small">${fmtH(s.h)} · ${s.pres.length} presentes${falta?` · <b style="color:var(--stitch)">${falta} vaga(s) descoberta(s)</b>`:""}</span></div>`;
  linhas().forEach(L=>{
    const ks=S.postos.filter(p=>p.linha===L&&s.need[p.id]!=null);if(!ks.length)return;
    h+=`<div class="lineblock"><h3>${esc(L)}<small>${ks.length} postos</small></h3><div class="pgrid">`;
    ks.forEach(pp=>{
      const as=s.as.filter(x=>x.postoId===pp.id),n=s.need[pp.id];
      const slots=[];for(let i=0;i<n;i++)slots.push(as[i]||null);
      const gap=slots.some(x=>!x),sup=as.some(x=>lvl(pessoa(x.pid),pp.id)<75);
      h+=`<div class="posto ${gap?"gap":sup?"sup":""}"><div class="ph"><b>${esc(pp.nome)}</b><span>${n>1?n+" pessoas":""}</span></div>`;
      slots.forEach(x=>{
        const cur=x?x.pid:"";const l=x?lvl(pessoa(cur),pp.id):0;
        const pinned=x&&x.mot==="fixado";
        const opts=s.pres.slice().sort((a,b)=>lvl(b,pp.id)-lvl(a,pp.id)||a.nome.localeCompare(b.nome)).map(p=>{
          const where=s.as.find(y=>y.pid===p.id);
          const extra=p.id===cur?"":where?` — está em ${nomePosto(where.postoId)}`:" — livre";
          return `<option value="${p.id}" ${p.id===cur?"selected":""}>${lvl(p,pp.id)} · ${esc(p.nome)}${esc(extra)}</option>`}).join("");
        h+=`<div class="slotrow">${x?`<span class="lv lv${l}">${l}</span>`:`<span class="lv lv0">—</span>`}
          <select data-act="slot" data-k="${pp.id}" data-a="${s.a}" data-b="${s.b}" data-cur="${cur}" aria-label="${esc(pp.nome)}">
          ${x?"":`<option value="" selected>Descoberto — escolher…</option>`}${pinned?`<option value="__auto">Voltar ao automático</option>`:""}${opts}</select></div>
          ${x?`<div class="mot">${esc(MOT[x.mot]||"")}${x.mot==="troca"?" de "+esc(nomePosto(x.de)):""}</div>`:""}`;
      });
      h+=`</div>`;
    });
    h+=`</div></div>`;
  });
  if(s.idle.length){
    h+=`<div class="lineblock"><h3>Livres neste horário<small>use para apoio ou treinamento</small></h3><div class="idle">${s.idle.map(pid=>{const p=pessoa(pid);
      const trein=Object.keys(s.need).filter(k=>lvl(p,k)===50).slice(0,2).map(nomePosto);
      return `<div class="chip"><span class="nm">${esc(p.nome)}</span>${trein.length?`<span class="small muted">treinar: ${esc(trein.join(", "))}</span>`:""}</div>`}).join("")}</div></div>`;
  }
  return h+`</div>`;
}
function viewPorPessoa(segs){
  let h=`<div class="tablewrap pp-table" style="margin-top:12px"><table class="rank pp"><thead><tr><th>Pessoa</th>${segs.map(s=>`<th>${hhmm(s.a)}–${hhmm(s.b)}</th>`).join("")}</tr></thead><tbody>`;
  ativos().forEach(p=>{
    h+=`<tr><td><b>${esc(p.nome)}</b><br><span class="small muted">${esc(p.funcao||"")}</span></td>`+segs.map(s=>{
      if(!s.pres.some(x=>x.id===p.id))return `<td class="muted small">${["F","J"].includes(day.presenca[p.id]?.st)?"falta":"ausente"}</td>`;
      const x=s.as.find(y=>y.pid===p.id);
      if(!x)return `<td class="small" style="color:var(--denim)">livre / apoio</td>`;
      const l=lvl(p,x.postoId);
      return `<td class="small"><span class="lv lv${l}">${l}</span> ${esc(nomePosto(x.postoId))}</td>`}).join("")+`</tr>`;
  });
  h+=`</tbody></table></div><div class="ppcards">`;
  ativos().forEach(p=>{
    h+=`<div class="ppcard"><b>${esc(p.nome)}</b> <span class="small muted">${esc(p.funcao||"")}</span>`+segs.map(s=>{
      let v;if(!s.pres.some(x=>x.id===p.id))v=`<span class="muted">${["F","J"].includes(day.presenca[p.id]?.st)?"falta":"ausente"}</span>`;
      else{const x=s.as.find(y=>y.pid===p.id);v=x?`<span class="lv lv${lvl(p,x.postoId)}">${lvl(p,x.postoId)}</span> ${esc(nomePosto(x.postoId))}`:`<span style="color:var(--denim)">livre / apoio</span>`}
      return `<div class="ln"><span>${hhmm(s.a)}–${hhmm(s.b)}</span><span>${v}</span></div>`}).join("")+`</div>`;
  });
  return h+`</div>`;
}
function nomePosto(k){const p=posto(k);return p?(p.linha==="Apoio"?p.nome:p.linha.replace("Linha ","L")+" "+p.nome):"?"}
function grpProdOptions(){
  const fam={};S.produtos.forEach(p=>{(fam[p.familia||"Sem família"]=fam[p.familia||"Sem família"]||[]).push(p)});
  return Object.keys(fam).sort().map(f=>`<optgroup label="${esc(f)}">${fam[f].sort((a,b)=>a.nome.localeCompare(b.nome)).map(p=>`<option value="${p.id}">${esc(p.nome)}</option>`).join("")}</optgroup>`).join("");
}
function rowPresenca(p){
  const pr=day.presenca[p.id]||{st:"P"};
  const hab=p.habitual?nomePosto(p.habitual):"sem posto habitual";
  const b=(st,t)=>`<button class="${st}" aria-pressed="${pr.st===st}" data-act="st" data-p="${p.id}" data-st="${st}">${t}</button>`;
  return `<div class="prow"><div class="who"><b>${esc(p.nome)}</b><small>${esc(p.funcao||"")} · ${esc(hab)}</small></div>
  <div class="seg" role="group" aria-label="Presença de ${esc(p.nome)}">${b("P","Presente")}${b("A","Parcial")}${b("F","Falta")}${b("J","Justif.")}</div>
  ${pr.st==="A"?`<div class="partial">Chegou <input type="time" value="${pr.ent||S.settings.inicio}" data-act="ent" data-p="${p.id}"> Saiu <input type="time" value="${pr.sai||S.settings.fim}" data-act="sai" data-p="${p.id}"><span class="muted">= ${fmtH(horasPessoa(pr))} no posto</span></div>`:""}</div>`;
}
function textoGrupo(){
  const segs=escala();const nm=id=>pessoa(id)?.nome||"?";
  let t=`*Escala ${fmtDate(curDate)} — ${S.settings.setor}*\n`;
  const f=ativos().filter(p=>["F","J"].includes(day.presenca[p.id]?.st)).map(p=>p.nome);
  const pa=ativos().filter(p=>day.presenca[p.id]?.st==="A").map(p=>`${p.nome} (${day.presenca[p.id].ent||S.settings.inicio}–${day.presenca[p.id].sai||S.settings.fim})`);
  if(f.length)t+=`Faltas: ${f.join(", ")}\n`;if(pa.length)t+=`Parciais: ${pa.join(", ")}\n`;
  segs.forEach(s=>{
    t+=`\n*${hhmm(s.a)}–${hhmm(s.b)} — ${[...new Set(s.items.map(it=>produto(it.prodId).nome))].join(" + ")}*\n`;
    linhas().forEach(L=>{const ks=S.postos.filter(p=>p.linha===L&&s.need[p.id]!=null);if(!ks.length)return;
      t+=`_${L}_\n`;ks.forEach(pp=>{const as=s.as.filter(x=>x.postoId===pp.id);t+=`• ${pp.nome}: ${as.length?as.map(x=>nm(x.pid)).join(" + "):"DESCOBERTO"}${s.rem[pp.id]>0&&as.length?" (falta "+s.rem[pp.id]+")":""}\n`})});
    if(s.idle.length)t+=`Livres/apoio: ${s.idle.map(nm).join(", ")}\n`;
  });
  return t;
}
/* ---------- ajustes da líder (fixações por horário) ---------- */
function cutPins(match,a,b){
  const out=[];
  (day.pins||[]).forEach(p=>{
    if(!match(p)||p.fim<=a||p.ini>=b){out.push(p);return}
    if(p.ini<a)out.push({...p,fim:a});
    if(p.fim>b)out.push({...p,ini:b});
  });
  day.pins=out;
}
function fixar(k,pid,a,b){
  cutPins(p=>p.pid===pid,a,b);
  day.pins.push({ini:a,fim:b,postoId:k,pid});
}

function rankData(){
  const days=Object.values(S.dias).sort((a,b)=>a.data.localeCompare(b.data));
  let from=null;
  if(rankPeriod==="mes")from=curDate.slice(0,7)+"-01";
  else if(rankPeriod!=="tudo"){const d=new Date(curDate+"T12:00:00");d.setDate(d.getDate()-Number(rankPeriod)+1);from=d.toISOString().slice(0,10)}
  const sel=days.filter(d=>(!from||d.data>=from)&&d.data<=curDate);
  const cj=!!S.settings.contarJustificadas;
  const m={};
  sel.forEach(d=>{
    const T=d.turnoH||turnoH();
    Object.entries(d.presenca||{}).forEach(([pid,pr])=>{
      const p=pessoa(pid);if(!p||p.ativo===false)return;
      const o=m[pid]=m[pid]||{p,dias:0,F:0,J:0,A:0,prev:0,perd:0};
      o.dias++;o.prev+=T;
      if(pr.st==="F"){o.F++;o.perd+=T}
      else if(pr.st==="J"){o.J++;if(cj)o.perd+=T;else o.prev-=T}
      else if(pr.st==="A"){o.A++;o.perd+=Math.max(0,T-horasPessoa(pr))}
    });
  });
  const list=Object.values(m).map(o=>({...o,ass:o.prev>0?1-o.perd/o.prev:1,oc:o.F+o.A+(cj?o.J:0)}));
  list.sort((a,b)=>b.ass-a.ass||a.oc-b.oc||b.dias-a.dias||a.p.nome.localeCompare(b.p.nome));
  const serie=sel.map(d=>{const T=d.turnoH||turnoH();let prev=0,perd=0;Object.entries(d.presenca||{}).forEach(([pid,pr])=>{if(!pessoa(pid))return;prev+=T;if(pr.st==="F"||pr.st==="J")perd+=T;else if(pr.st==="A")perd+=Math.max(0,T-horasPessoa(pr))});return{data:d.data,taxa:prev?perd/prev:0}});
  return{list,serie,n:sel.length};
}
function viewRank(){

    <p class="muted small">Assiduidade = horas trabalhadas ÷ horas previstas no turno. Contam faltas, atrasos e saídas antecipadas; faltas justificadas ${S.settings.contarJustificadas?"<b>também contam</b>":"<b>não penalizam</b>"} (mude em Ajustes). Empate: menos ocorrências, depois mais dias registrados. ${n} dia(s) registrado(s) no período.</p>`;
  if(!list.length)return h+`<div class="card empty"><h2>Sem dias registrados no período</h2><p class="muted">O ranking se forma a partir da presença lançada na aba Dia.</p></div>`;
  const top=list.slice(0,3);
  h+=`<div class="podium">${top.map((o,i)=>`<div class="card"><span class="muted small">${i+1}º lugar</span><b>${esc(o.p.nome)}</b><span>${pct(o.ass)} de assiduidade · ${o.oc} ocorrência(s) em ${o.dias} dia(s)</span></div>`).join("")}</div>`;
  const avg=serie.length?serie.reduce((s,x)=>s+x.taxa,0)/serie.length:0;
  h+=`<div class="card" style="margin-bottom:14px"><div class="row"><b style="flex:1">Absenteísmo por dia (horas perdidas ÷ horas previstas)</b><span class="small muted">média ${pct(avg)}</span></div>${sparkBars(serie.slice(-40))}</div>`;
  h+=`<div class="rankcards">${list.map((o,i)=>`<div class="rankcard ${i<3?"top":""}"><span class="pos">${i+1}</span><b>${esc(o.p.nome)}</b><span class="pct">${pct(o.ass)}</span><small>${o.dias} dia(s) · ${o.F} falta(s) · ${o.J} justif. · ${o.A} parcial(is) · ${fmtH(o.perd)} perdidas</small></div>`).join("")}</div>`;
  h+=`<div class="tablewrap rank-table"><table class="rank"><thead><tr><th>#</th><th>Nome</th><th>Função</th><th>Dias</th><th>Faltas</th><th>Justif.</th><th>Parciais</th><th>Horas perdidas</th><th>Assiduidade</th></tr></thead><tbody>
  ${list.map((o,i)=>`<tr class="${i<3?"top":""}"><td class="pos">${i+1}</td><td><b>${esc(o.p.nome)}</b></td><td>${esc(o.p.funcao||"")}</td><td>${o.dias}</td><td>${o.F}</td><td>${o.J}</td><td>${o.A}</td><td>${fmtH(o.perd)}</td>
  <td><div class="row" style="flex-wrap:nowrap"><div class="bar" style="flex:1"><i style="width:${Math.max(0,o.ass*100)}%"></i></div><b>${pct(o.ass)}</b></div></td></tr>`).join("")}</tbody></table></div>`;
  return h;
}
function sparkBars(s){
  if(!s.length)return `<p class="muted small">Sem dados.</p>`;
  const W=Math.max(300,s.length*22),H=120,mx=Math.max(0.1,...s.map(x=>x.taxa));
  const bw=W/s.length;
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H+22}" width="100%" style="min-width:${Math.min(W,600)}px" role="img" aria-label="Absenteísmo diário">
  ${s.map((x,i)=>{const bh=x.taxa/mx*H;return `<rect x="${i*bw+3}" y="${H-bh}" width="${bw-6}" height="${Math.max(bh,1)}" rx="2" fill="${x.taxa>0.15?"var(--stitch)":x.taxa>0.05?"var(--warn)":"var(--ok)"}"><title>${fmtDate(x.data)}: ${(x.taxa*100).toFixed(1)}%</title></rect>
  <text x="${i*bw+bw/2}" y="${H+15}" font-size="10" text-anchor="middle" fill="var(--muted)">${x.data.slice(8)}/${x.data.slice(5,7)}</text>`}).join("")}</svg></div>`;
}

/* tooltip dos gráficos (mouse e toque) */
(function(){
  let tip=null;
  const hide=()=>{if(tip){tip.remove();tip=null}};
  const show=e=>{
    const g=e.target.closest&&e.target.closest("[data-tip]");if(!g){hide();return}
    if(!tip){tip=document.createElement("div");tip.className="charttip";tip.setAttribute("role","status");document.body.appendChild(tip)}
    tip.innerHTML=esc(g.dataset.tip).replace(/\n/g,"<br>");
    const w=tip.offsetWidth,hh=tip.offsetHeight;
    let x=e.clientX+14,y=e.clientY-hh-12;
    if(x+w>window.innerWidth-8)x=e.clientX-w-14;if(x<8)x=8;if(y<8)y=e.clientY+18;
    tip.style.left=x+"px";tip.style.top=y+"px";
  };
  app.addEventListener("pointermove",show);
  app.addEventListener("pointerdown",show);
  app.addEventListener("pointerleave",hide);
  window.addEventListener("scroll",hide,{passive:true});
})();

function listaEmails(t){return String(t||"").split(/[,;\s]+/).map(x=>x.trim()).filter(x=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x))}
function strip(h){return String(h).replace(/<[^>]+>/g,"").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&#39;/g,"'")}
function dadosRelatorio(){
  const segs=escala();const nm=id=>pessoa(id)?.nome||"?";
  const faltas=ativos().filter(p=>["F","J"].includes(day.presenca[p.id]?.st)).map(p=>p.nome+(day.presenca[p.id].st==="J"?" (justificada)":""));
  const parciais=ativos().filter(p=>day.presenca[p.id]?.st==="A").map(p=>`${p.nome} (${day.presenca[p.id].ent||S.settings.inicio}–${day.presenca[p.id].sai||S.settings.fim})`);
  const desc=segs.reduce((m,s)=>m+Object.values(s.rem).filter(v=>v>0).reduce((a,b)=>a+b,0),0);
  const aten=segs.reduce((m,s)=>m+s.as.filter(x=>lvl(pessoa(x.pid),x.postoId)<75).length,0);
  const ori=[];
  orientacoes(segs).forEach(c=>{
    const titulo=c.tipo==="pessoa"?`${c.p.nome} ${c.quando}`:`${nomePosto(c.k)}: sem pessoa apta`;
    if(!c.rows.length){ori.push({sev:"Resolvido",titulo,hora:"",txt:c.k?"Posto não está no plano nesse horário.":"Sem posto habitual."});return}
    c.rows.forEach(r=>{
      const s=r.segs[0];
      let t=r.cov.map(pid=>{const l=lvl(pessoa(pid),c.k);return `${nm(pid)} (nível ${l}) assume${l<75?" — acompanhar":""}`}).join("; ");
      if(r.falta>0)t+=(t?". ":"")+`Faltam ${r.falta} pessoa(s)`;
      const fraco=r.cov.find(pid=>lvl(pessoa(pid),c.k)<75);
      const alts=(r.falta>0||fraco)?alternativas(s,c.k,fraco).filter(o=>r.falta>0||o.lv>(fraco?lvl(pessoa(fraco),c.k):-1)):[];
      if(alts.length)t+=`. Sugestão: ${strip(alts[0].txt)}`;
      ori.push({sev:r.falta>0?"Descoberto":fraco?"Atenção":"Resolvido",titulo,hora:`${hhmm(r.a)}–${hhmm(r.b)}`,txt:t});
    });
  });
  const blocos=segs.map(s=>({hora:`${hhmm(s.a)}–${hhmm(s.b)}`,prods:[...new Set(s.items.map(it=>produto(it.prodId).nome))].join(" + "),
    linhas:linhas().map(L=>({L,postos:S.postos.filter(p=>p.linha===L&&s.need[p.id]!=null).map(pp=>{const as=s.as.filter(x=>x.postoId===pp.id);
      return{posto:pp.nome,pessoas:as.map(x=>({nome:nm(x.pid),lv:lvl(pessoa(x.pid),pp.id)})),falta:Math.max(0,s.rem[pp.id])}})})).filter(x=>x.postos.length),
    livres:s.idle.map(nm)}));
  let rk=null;if(S.settings.emailRanking!==false){const sv=rankPeriod;rankPeriod="30";rk=rankData().list.slice(0,10);rankPeriod=sv}
  const ritmo=day.producao.map(it=>ritmoItem(it,segs)).filter(x=>x&&x.r.g).map(x=>{const r=x.r;
    return{prod:x.p.nome,hora:`${hhmm(x.a)}–${hhmm(x.b)}`,txt:`takt ${r.takt?fmtMin(r.takt):"—"} · gargalo ${r.g.nome} (${r.g.parado?"sem pessoa":fmtMin(r.g.ciclo)+"/pç"}) · capacidade ${fmtN(r.cap,0)} pç${r.q?` para pedido de ${fmtN(r.q,0)}`:""}`,ruim:!!(r.g.parado||(r.q&&r.cap<r.q))}});
  const gdT=totaisGD(day),gdM=metasLinha(day).m;
  const gd={tot:gdT,linhas:linhasGD(day).map(L=>{const r=realLinha(day,L),mt=gdM[L]||0,mr=metaRef(day,L);return{L,meta:mt,real:r,f:farol(r,mr.meta),ate:mr.ate,obs:gdOf(day).obs[L]||""}}).filter(x=>x.meta||x.real!=null),acoes:acoesAbertas()};
  return{segs,faltas,parciais,desc,aten,ori,blocos,rk,ritmo,gd,pres:presentes().length};
}
function montarRelatorio(op){
  const d=dadosRelatorio();const S0=S.settings;
  const subject=`${S0.emailAssunto||"Escala"} — ${S0.empresa} ${S0.setor} — ${fmtDate(curDate)}`;
  const pct=v=>(v*100).toLocaleString("pt-BR",{maximumFractionDigits:1})+"%";
  // texto
  let t=`${subject}\n\nRESUMO\nPresentes: ${d.pres} | Faltas: ${d.faltas.length} | Parciais: ${d.parciais.length} | Vagas descobertas: ${d.desc} | Postos com nível 50: ${d.aten}\n`;
  if(d.faltas.length)t+=`Faltas: ${d.faltas.join(", ")}\n`;if(d.parciais.length)t+=`Parciais: ${d.parciais.join(", ")}\n`;
  if(op.ori&&d.ori.length){t+=`\nO QUE FOI FEITO / ATENÇÃO\n`;d.ori.forEach(o=>t+=`- [${o.sev}] ${o.titulo}${o.hora?" ("+o.hora+")":""}: ${o.txt}\n`)}
  if(d.gd.linhas.length){t+=`\nGESTÃO DIÁRIA\nMeta ${fmtQ(d.gd.tot.meta)} | Realizado ${fmtQ(d.gd.tot.real)} | Atingimento ${fmtPct(d.gd.tot.ating)}\n`;d.gd.linhas.forEach(x=>t+=`- ${x.L}: ${fmtQ(x.real)} de ${fmtQ(x.meta)}${x.ate?" (parcial até "+x.ate+")":""}${x.f?" ("+FAROL_TXT[x.f]+")":""}${x.obs?" · "+x.obs:""}\n`)}
  if(d.gd.acoes.length){t+=`\nAÇÕES ABERTAS\n`;d.gd.acoes.forEach(a=>t+=`- ${a.acao||a.prob} · ${a.resp||"sem responsável"} · ${a.prazo?fmtDate(a.prazo):"sem prazo"}${acaoVencida(a)?" (VENCIDA)":""}\n`)}
  if(d.ritmo.length){t+=`\nRITMO E GARGALO\n`;d.ritmo.forEach(x=>t+=`- ${x.ruim?"[NÃO ATENDE] ":""}${x.prod} (${x.hora}): ${x.txt}\n`)}
  if(op.esc){d.blocos.forEach(b=>{t+=`\nESCALA ${b.hora} — ${b.prods}\n`;b.linhas.forEach(l=>{t+=`${l.L}\n`;l.postos.forEach(p=>t+=`  • ${p.posto}: ${p.pessoas.length?p.pessoas.map(x=>x.nome).join(" + "):"DESCOBERTO"}${p.falta&&p.pessoas.length?" (falta "+p.falta+")":""}\n`)});if(b.livres.length)t+=`Livres/apoio: ${b.livres.join(", ")}\n`})}
  if(op.rk&&d.rk&&d.rk.length){t+=`\nRANKING DE ASSIDUIDADE (30 dias)\n`;d.rk.forEach((o,i)=>t+=`${i+1}. ${o.p.nome} — ${pct(o.ass)} (${o.oc} ocorrência(s))\n`)}
  t+=`\nGerado pelo app Escala da Costura.`;
  // html
  const C={ink:"#1B2437",ok:"#23845A",warn:"#B7791F",bad:"#C0392B",line:"#D4DAE3",soft:"#EEF1F5"};
  const sevC=s=>s==="Descoberto"?C.bad:s==="Atenção"?C.warn:C.ok;
  const lvC=l=>l>=100?"#23845A":l>=75?"#8FCFA5":l>=50?"#F7DE7E":"#F6B89A";
  const td=`style="padding:6px 8px;border-bottom:1px solid ${C.line};font-size:13px;vertical-align:top"`;
  let h=`<div style="font-family:Arial,Helvetica,sans-serif;color:${C.ink};max-width:720px">

  const fC={ok:C.ok,amb:C.warn,red:C.bad};
  if(d.gd.linhas.length)h+=`<h3 style="font-size:16px;margin:18px 0 6px">Gestão diária · atingimento ${fmtPct(d.gd.tot.ating)}</h3><table cellpadding="0" cellspacing="0" style="width:100%;border-collapse:collapse"><tr><td ${td}><b>Linha</b></td><td ${td} style="text-align:right"><b>Meta</b></td><td ${td} style="text-align:right"><b>Real</b></td><td ${td}><b>Status</b></td></tr>`+d.gd.linhas.map(x=>`<tr><td ${td}>${esc(x.L)}${x.obs?`<br><span style="color:#5E6A7E">${esc(x.obs)}</span>`:""}</td><td ${td} style="text-align:right">${fmtQ(x.meta)}</td><td ${td} style="text-align:right">${fmtQ(x.real)}</td><td ${td}>${x.f?`<b style="color:${fC[x.f]}">${FAROL_TXT[x.f]}</b>`:"—"}</td></tr>`).join("")+`</table>`;
  if(d.gd.acoes.length)h+=`<h3 style="font-size:16px;margin:18px 0 6px">Ações abertas</h3><table cellpadding="0" cellspacing="0" style="width:100%;border-collapse:collapse">`+d.gd.acoes.map(a=>`<tr><td ${td}>${esc(a.acao||a.prob||"")}</td><td ${td}>${esc(a.resp||"—")}</td><td ${td}>${a.prazo?fmtDate(a.prazo):"—"}${acaoVencida(a)?` <b style="color:${C.bad}">vencida</b>`:""}</td></tr>`).join("")+`</table>`;
  if(d.ritmo.length)h+=`<h3 style="font-size:16px;margin:18px 0 6px">Ritmo e gargalo</h3><table cellpadding="0" cellspacing="0" style="width:100%;border-collapse:collapse">`+d.ritmo.map(x=>`<tr><td ${td} width="40%"><b>${esc(x.prod)}</b><br><span style="color:#5E6A7E">${x.hora}</span></td><td ${td}>${x.ruim?`<b style="color:${C.bad}">Não atende · </b>`:""}${esc(x.txt)}</td></tr>`).join("")+`</table>`;
  if(op.esc)d.blocos.forEach(b=>{h+=`<h3 style="font-size:16px;margin:18px 0 6px;border-top:3px solid ${C.ink};padding-top:8px">${b.hora} <span style="font-weight:normal;color:#5E6A7E">· ${esc(b.prods)}</span></h3><table cellpadding="0" cellspacing="0" style="width:100%;border-collapse:collapse">`;
    b.linhas.forEach(l=>{h+=`<tr><td colspan="2" style="padding:8px 8px 4px;font-weight:bold;font-size:13px;color:#2B4B7C">${esc(l.L)}</td></tr>`;l.postos.forEach(p=>h+=`<tr><td ${td} width="45%">${esc(p.posto)}</td><td ${td}>${p.pessoas.length?p.pessoas.map(x=>`<span style="display:inline-block;min-width:26px;text-align:center;border-radius:4px;font-size:11px;font-weight:bold;background:${lvC(x.lv)};color:${x.lv>=100?"#fff":C.ink}">${x.lv}</span> ${esc(x.nome)}`).join("<br>"):`<b style="color:${C.bad}">DESCOBERTO</b>`}${p.falta&&p.pessoas.length?` <span style="color:${C.bad}">(falta ${p.falta})</span>`:""}</td></tr>`)});
    if(b.livres.length)h+=`<tr><td ${td} style="color:#5E6A7E">Livres / apoio</td><td ${td}>${esc(b.livres.join(", "))}</td></tr>`;h+=`</table>`});
  if(op.rk&&d.rk&&d.rk.length)h+=`<h3 style="font-size:16px;margin:18px 0 6px">Ranking de assiduidade — 30 dias</h3><table cellpadding="0" cellspacing="0" style="width:100%;border-collapse:collapse">`+d.rk.map((o,i)=>`<tr style="${i<3?"background:#FBF1D2":""}"><td ${td} width="30"><b>${i+1}</b></td><td ${td}>${esc(o.p.nome)}</td><td ${td} style="text-align:right"><b>${pct(o.ass)}</b> <span style="color:#5E6A7E">· ${o.oc} ocorr.</span></td></tr>`).join("")+`</table>`;
  h+=`<p style="font-size:11px;color:#5E6A7E;margin-top:18px">Gerado pelo app Escala da Costura.</p></div>`;
  return{subject,text:t,html:h};
}
function abrirEnvio(){
  const s=S.settings;const temAuto=!!s.emailEndpoint;
  const body=`<div class="field"><label>Para</label><input type="email" multiple data-mf="to" value="${esc(listaEmails(s.emails).join(", "))}" placeholder="email@empresa.com.br"></div>
  ${listaEmails(s.emails).length?"":`<div class="warnbox">Nenhum e-mail cadastrado. Digite acima ou cadastre em Ajustes → Relatório por e-mail.</div>`}
  <label class="ck"><input type="checkbox" data-mf="ori" checked> Orientações (faltas, substituições e atenção)</label>
  <label class="ck"><input type="checkbox" data-mf="esc" checked> Escala completa por horário</label>
  <label class="ck"><input type="checkbox" data-mf="rk" ${s.emailRanking!==false?"checked":""}> Ranking de assiduidade (30 dias)</label>
  ${temAuto?`<div class="okbox">Envio automático configurado: o e-mail sai direto, com formatação.</div>`:`<div class="help">Para enviar sem abrir o app de e-mail, configure o envio automático em Ajustes.</div>`}`;
  const btns=temAuto?[["Enviar agora","auto"],["Abrir no app de e-mail","mail"],["Copiar texto","copyrep"],["Fechar","close"]]:[["Abrir no app de e-mail","mail"],["Copiar texto","copyrep"],["Fechar","close"]];
  modal("Enviar relatório do dia",body,btns,async(k,v)=>{
    if(k==="close")return;
    const to=listaEmails(v.to);
    const r=montarRelatorio({ori:v.ori,esc:v.esc,rk:v.rk});
    if(k==="copyrep"){let ok=false;try{await navigator.clipboard.writeText(r.text);ok=true}catch(e){}toast(ok?"Relatório copiado. Cole no corpo do e-mail.":"Não consegui copiar automaticamente neste navegador.");return"keep"}
    if(!to.length){toast("Informe pelo menos um e-mail válido.");return"keep"}
    if(k==="mail"){
      let body=r.text;if(body.length>1800)toast("Relatório longo: se o app de e-mail cortar o texto, use Copiar texto e cole.");
      const a=document.createElement("a");a.href=`mailto:${to.join(",")}?subject=${encodeURIComponent(r.subject)}&body=${encodeURIComponent(body)}`;a.target="_top";document.body.appendChild(a);a.click();a.remove();
      registrarEnvio(to,"mail");return}
    if(k==="auto"){const ok=await postEmail(to,r);if(ok){registrarEnvio(to,"auto");toast(`Enviado para ${to.length} destinatário(s). Pode levar 1 minuto para chegar.`)}else return"keep"}
  });
}
async function postEmail(to,r){
  const s=S.settings;
  try{
    await fetch(s.emailEndpoint,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({token:s.emailToken||"",to:to.join(","),subject:r.subject,html:r.html,text:r.text})});
    return true;
  }catch(e){toast("O envio automático não está disponível aqui (sem internet ou bloqueado pelo navegador). Use Abrir no app de e-mail.");return false}
}
function registrarEnvio(to,modo){day.envios=(day.envios||[]).concat([{em:new Date().toISOString(),para:to.join(", "),modo}]).slice(-20);saveDaySoon();render()}
async function testarEnvio(){
  const to=listaEmails(S.settings.emails);if(!to.length){toast("Cadastre ao menos um e-mail.");return}
  const ok=await postEmail(to,{subject:`Teste — ${S.settings.empresa} Escala`,text:"E-mail de teste do app Escala da Costura. Se chegou, o envio automático está funcionando.",html:"<p style='font-family:Arial'>E-mail de teste do app <b>Escala da Costura</b>. Se chegou, o envio automático está funcionando.</p>"});
  if(ok)toast("Teste enviado. Confira a caixa de entrada (e o spam) em 1 minuto.");
}

/* ============================ MODAL ============================ */
function modal(title,body,buttons,onBtn){
  const root=document.getElementById("modalRoot");
  root.innerHTML=`<div class="modal-bg" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal"><h3>${esc(title)}</h3>${body}<div class="row" style="justify-content:flex-end;margin-top:12px">${buttons.map(([t,k],i)=>`<button class="btn ${i===0?"primary":""}" data-mb="${k}">${esc(t)}</button>`).join("")}</div></div></div>`;
  root.querySelector("[data-mb]")?.focus();
  root.onclick=async ev=>{
    const b=ev.target.closest("[data-mb]");if(!b){if(ev.target.classList.contains("modal-bg"))root.innerHTML="";return}
    const k=b.dataset.mb;
    if(k==="copy"){const ta=document.getElementById("wtxt");ta.select();let ok=false;try{await navigator.clipboard.writeText(ta.value);ok=true}catch(err){try{ok=document.execCommand("copy")}catch(e2){}}toast(ok?"Texto copiado.":"Selecione o texto e copie manualmente.");return}
    const vals={};root.querySelectorAll("[data-mf]").forEach(el=>vals[el.dataset.mf]=el.type==="checkbox"?el.checked:el.value);
    if(onBtn){const r=await onBtn(k,vals);if(r==="keep")return}
    root.innerHTML="";
  };
}
function confirmBox(msg,okText,fn){modal("Confirmar",`<p>${esc(msg)}</p>`,[[okText,"ok"],["Cancelar","cancel"]],k=>{if(k==="ok")fn()})}
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(reu)fecharReu();else document.getElementById("modalRoot").innerHTML=""}});

/* ============================ IMPORT / EXPORT ============================ */
async function exportar(){
  const data=JSON.stringify({app:"vicon-escala",versao:1,exportadoEm:new Date().toISOString(),settings:S.settings,postos:S.postos,pessoas:S.pessoas,produtos:S.produtos,acoes:S.acoes,dias:Object.values(S.dias)},null,1);
  const filename=`backup_escala_${(S.settings.empresa||"vicon").toLowerCase()}_${todayISO()}.json`;
  let dl=null;try{if(window.claude&&window.claude.use)dl=await window.claude.use("downloads")}catch(e){}
  if(dl){try{const r=await dl.save({filename,data:new Blob([data],{type:"application/json"})});if(r&&r.status==="saved")toast("Backup baixado.");}catch(e){if(e.code!=="cancelled"&&e.code!=="declined")toast("Não foi possível baixar: "+(e.message||e.code))}return}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=filename;document.body.appendChild(a);a.click();a.remove();
}
function importJson(file){
  const fr=new FileReader();fr.onload=()=>{
    let d;try{d=JSON.parse(fr.result)}catch(e){toast("Arquivo inválido: não é um backup deste app.");return}
    if(!d||!Array.isArray(d.postos)||!Array.isArray(d.pessoas)){toast("Arquivo inválido: faltam postos ou pessoas.");return}
    confirmBox(`Restaurar o backup de ${d.exportadoEm?fmtDate(d.exportadoEm.slice(0,10)):"data desconhecida"}? A matriz, os produtos e os ${(d.dias||[]).length} dias do arquivo substituem os dados atuais com o mesmo dia.`,"Restaurar",async()=>{
      S.settings={...DEF_SETTINGS,...(d.settings||{})};S.postos=d.postos;S.pessoas=d.pessoas;S.produtos=d.produtos||[];if(Array.isArray(d.acoes))S.acoes=d.acoes;
      ["settings","postos","pessoas","produtos","acoes"].forEach(saveCfg);
      for(const dy of d.dias||[]){if(dy&&dy.data){S.dias[dy.data]=dy;try{await store.saveDay(dy)}catch(e){toast("Erro ao salvar o dia "+dy.data);break}}}
      loadDay(curDate);tab="dia";render();toast("Backup restaurado.");
    });
  };fr.readAsText(file);
}
function loadSheetJS(){
  if(window.XLSX)return Promise.resolve();
  return new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=res;s.onerror=()=>rej(new Error("não foi possível carregar o leitor de Excel"));document.head.appendChild(s)});
}
async function importXlsx(file){
  try{await loadSheetJS()}catch(e){toast(e.message);return}
  const buf=await file.arrayBuffer();let wb;
  try{wb=XLSX.read(buf,{type:"array"})}catch(e){toast("Não consegui ler o arquivo Excel.");return}
  const name=wb.SheetNames.find(n=>n.trim().toUpperCase()==="MV")||wb.SheetNames.find(n=>/matriz|mv/i.test(n))||wb.SheetNames[0];
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null});
  const find=re=>{for(let r=0;r<rows.length;r++)for(let c=0;c<(rows[r]||[]).length;c++){const v=rows[r][c];if(typeof v==="string"&&re.test(v.trim()))return[r,c]}return null};
  const hdr=find(/^nome do processo$/i),metaC=find(/ideal de treinados/i),nomeC=find(/^nome$/i),fim=find(/diagn[oó]stico/i);
  if(!hdr||!nomeC){toast("Não encontrei o cabeçalho da MV (“Nome do Processo” e “Nome”). Confira a aba.");return}
  const [hr,hc]=hdr;const cols=[];
  for(let c=hc+1;c<rows[hr].length;c++){const v=rows[hr][c];if(typeof v==="string"&&v.trim()&&!/postos dominados|polival|data de avalia|observa/i.test(v))cols.push([c,v.trim()])}
  const lin=n=>{const m=n.match(/^linha\s*(\d+)/i);return m?"Linha "+m[1]:"Apoio"};
  const short=n=>n.replace(/^linha\s*\d+\s*-\s*/i,"").trim();
  const newPostos=cols.map(([c,n])=>{const nm=short(n),L=lin(n);const ex=S.postos.find(p=>p.nome.toLowerCase()===nm.toLowerCase()&&p.linha===L);
    const meta=metaC&&typeof rows[metaC[0]][c]==="number"?rows[metaC[0]][c]:(ex?.meta??2);
    return{id:ex?ex.id:uid("p"),nome:nm,linha:L,meta,_c:c}});
  const start=(metaC?metaC[0]:nomeC[0])+1,end=fim?fim[0]:rows.length;
  const nc=nomeC[1];let novos=0,atual=0;
  for(let r=start;r<end;r++){
    const row=rows[r]||[];let nm=row[nc];if(typeof nm!=="string"||!nm.trim())continue;nm=nm.trim();
    let ativo=true;if(/\(.*n[ãa]o.*\)/i.test(nm)){ativo=false;nm=nm.replace(/\(.*\)/,"").trim()}
    const lider=row.slice(0,nc).some(v=>typeof v==="string"&&/l[íi]der/i.test(v));
    const niveis={};newPostos.forEach(p=>{const v=row[p._c];if(typeof v==="number"&&v>0)niveis[p.id]=LV.reduce((a,b)=>Math.abs(b-v)<Math.abs(a-v)?b:a,0)});
    let p=S.pessoas.find(x=>x.nome.toLowerCase()===nm.toLowerCase());
    if(p){p.niveis=niveis;if(!ativo)p.ativo=false;atual++}
    else{S.pessoas.push({id:uid("c"),nome:nm,funcao:lider?"Líder":(typeof row[nc+1]==="string"?row[nc+1].trim():""),ativo:lider?false:ativo,habitual:"",niveis});novos++}
  }
  const keep=S.postos.filter(p=>!newPostos.some(n=>n.id===p.id));
  S.postos=[...newPostos.map(({_c,...p})=>p),...keep];
  saveCfg("postos");saveCfg("pessoas");loadDay(curDate);
  toast(`Matriz importada: ${newPostos.length} postos, ${atual} pessoas atualizadas, ${novos} novas. Defina o posto habitual de cada uma na aba Matriz.`);
  tab="matriz";render();
}

/* ============================ BOOT ============================ */
const SEED={"settings": {"empresa": "Vicon", "setor": "Costura", "inicio": "07:00", "fim": "17:00", "almIni": "12:00", "almFim": "13:00", "contarJustificadas": false}, "postos": [], "pessoas": [], "produtos": []};

(async function boot(){
  let db=null;
  try{if(window.claude&&typeof window.claude.use==="function")db=await window.claude.use("db")}catch(e){db=null}
  store=db?dbStore(db):localStore();
  try{
    const d=await store.load();
    if(d.settings)S.settings={...DEF_SETTINGS,...d.settings};
    S.postos=d.postos||[];S.pessoas=d.pessoas||[];S.produtos=d.produtos||[];S.acoes=d.acoes||[];S.dias=d.dias||{};
  }catch(e){
    if(store.mode==="db"){store=localStore();const d=await store.load();if(d.settings)S.settings={...DEF_SETTINGS,...d.settings};S.postos=d.postos||[];S.pessoas=d.pessoas||[];S.produtos=d.produtos||[];S.acoes=d.acoes||[];S.dias=d.dias||{};toast("Sem acesso à nuvem agora: usando os dados deste navegador.")}
  }
  if(store.mode==="local"&&!S.postos.length&&!S.pessoas.length){
    S.settings={...DEF_SETTINGS,...SEED.settings};S.postos=clone(SEED.postos);S.pessoas=clone(SEED.pessoas);S.produtos=clone(SEED.produtos);
    ["settings","postos","pessoas","produtos"].forEach(saveCfg);
  }
  setSave(store.mode==="db"?"Dados na nuvem":"Dados neste aparelho");
  loadDay(todayISO());render();
})();
