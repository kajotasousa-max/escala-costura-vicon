<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vicon — Escala da Costura</title>
<meta name="theme-color" content="#1B2437">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🧵%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1B2437; --denim:#2B4B7C; --denim-2:#3D6199; --paper:#EEF1F5; --card:#FFFFFF; --line:#D4DAE3;
  --muted:#5E6A7E; --chalk:#E4B12A; --chalk-soft:#FBF1D2; --stitch:#C0392B; --stitch-soft:#F8E1DE;
  --ok:#23845A; --ok-soft:#DDF1E6; --warn:#B7791F; --warn-soft:#FCEFD5;
  --l0:#EDF0F4; --l25:#F6B89A; --l50:#F7DE7E; --l75:#8FCFA5; --l100:#23845A;
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#E6EAF2; --denim:#8FB0E6; --denim-2:#AFC6EE; --paper:#12161F; --card:#1B2130; --line:#2E3647;
    --muted:#9AA5B8; --chalk:#E9BD45; --chalk-soft:#3A3120; --stitch:#EF7A6B; --stitch-soft:#3C2224;
    --ok:#4CC08A; --ok-soft:#1C3329; --warn:#E3A94B; --warn-soft:#382C18;
    --l0:#262D3C; --l25:#8E4E36; --l50:#8C7428; --l75:#2F7A50; --l100:#4CC08A;
  }
}
:root[data-theme="dark"]{
  --ink:#E6EAF2; --denim:#8FB0E6; --denim-2:#AFC6EE; --paper:#12161F; --card:#1B2130; --line:#2E3647;
  --muted:#9AA5B8; --chalk:#E9BD45; --chalk-soft:#3A3120; --stitch:#EF7A6B; --stitch-soft:#3C2224;
  --ok:#4CC08A; --ok-soft:#1C3329; --warn:#E3A94B; --warn-soft:#382C18;
  --l0:#262D3C; --l25:#8E4E36; --l50:#8C7428; --l75:#2F7A50; --l100:#4CC08A;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-weight:700;letter-spacing:.01em;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--chalk);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px 48px}

/* top bar */
header.top{background:var(--ink);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
:root[data-theme="dark"] header.top{background:#0C1018}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) header.top{background:#0C1018}}
.top-in{max-width:1280px;margin:0 auto;padding:10px 16px 0;display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 20px}
.brand{display:flex;align-items:baseline;gap:10px;padding-bottom:10px}
.brand h1{font-size:26px;color:#fff}
.brand span{color:#AEB9CC;font-size:14px}
nav.tabs{display:flex;gap:2px;margin-left:auto;overflow-x:auto;max-width:100%}
nav.tabs button{background:transparent;border:0;color:#C9D2E1;padding:10px 14px 12px;font-family:"Barlow Condensed",sans-serif;font-size:18px;font-weight:600;border-bottom:4px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:#fff;border-bottom-color:var(--chalk)}
.savestate{font-size:12px;color:#AEB9CC;padding-bottom:12px}

/* generic */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:8px 14px;font-weight:600}
.btn:hover{border-color:var(--denim)}
.btn.primary{background:var(--denim);border-color:var(--denim);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0C1018}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0C1018}}
.btn.chalk{background:var(--chalk);border-color:var(--chalk);color:#1B2437}
.btn.danger{color:var(--stitch);border-color:var(--stitch-soft)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=number],input[type=time],input[type=date],select,textarea{border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:7px 10px;min-height:38px}
input[type=number]{width:90px}
table{border-collapse:collapse}
.hidden{display:none!important}

/* steps */
.steps{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:16px}
@media (max-width:900px){.steps{grid-template-columns:1fr}}
.step h2{font-size:22px;display:flex;align-items:center;gap:10px;margin-bottom:10px}
.step h2 .n{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;font-size:17px}
:root[data-theme="dark"] .step h2 .n{background:var(--denim);color:#0C1018}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .step h2 .n{background:var(--denim);color:#0C1018}}
.daybar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:16px}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;min-width:92px}
.kpi b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:24px;line-height:1.1}
.kpi span{font-size:12px;color:var(--muted)}
.kpi.bad b{color:var(--stitch)} .kpi.good b{color:var(--ok)}

/* presence */
.plist{max-height:560px;overflow:auto;border-top:1px solid var(--line)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:8px 2px;border-bottom:1px solid var(--line);align-items:center}
.prow .who b{font-weight:600}
.prow .who small{display:block;color:var(--muted);font-size:12px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 10px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button[aria-pressed="true"].P{background:var(--ok-soft);color:var(--ok)}
.seg button[aria-pressed="true"].A{background:var(--warn-soft);color:var(--warn)}
.seg button[aria-pressed="true"].F{background:var(--stitch-soft);color:var(--stitch)}
.seg button[aria-pressed="true"].J{background:var(--l0);color:var(--ink)}
.partial{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;padding-left:2px}
.partial input{min-height:32px;padding:3px 6px}

/* production */
.prod-add{display:flex;gap:8px;flex-wrap:wrap}
.prod-add select{flex:1;min-width:200px}
.pitem{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.pitem .nm{flex:1;min-width:0}
.pitem .nm small{display:block;color:var(--muted);font-size:12px}

/* allocation */
.alloc{margin-top:16px}
.alerts{display:grid;gap:8px;margin:10px 0 14px}
.alert{border-radius:8px;padding:10px 12px;font-size:14px;border-left:5px solid}
.alert.red{background:var(--stitch-soft);border-color:var(--stitch)}
.alert.amb{background:var(--warn-soft);border-color:var(--warn)}
.alert.blue{background:var(--l0);border-color:var(--denim)}
.lineblock{margin-top:14px}
.lineblock h3{font-size:20px;margin-bottom:8px;display:flex;gap:10px;align-items:baseline}
.lineblock h3 small{font-family:"Barlow",sans-serif;font-size:13px;font-weight:500;color:var(--muted)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.posto{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);padding:10px 10px 8px;display:flex;flex-direction:column;gap:6px}
.posto.gap{border:2px dashed var(--stitch);background:repeating-linear-gradient(135deg,transparent 0 10px,var(--stitch-soft) 10px 12px),var(--card)}
.posto.sup{border-color:var(--warn)}
.posto .ph{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.posto .ph b{font-weight:700;font-size:15px}
.posto .ph span{font-size:12px;color:var(--muted);white-space:nowrap}
.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:7px;padding:3px 4px 3px 6px;font-size:14px;background:var(--paper)}
.chip .nm{flex:1;min-width:0;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.chip input{width:52px;min-height:28px;padding:2px 4px;font-size:13px}
.chip .hh{font-size:12px;color:var(--muted);margin-left:-4px}
.chip .x{border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;padding:0 4px}
.chip .pin{border:0;background:transparent;padding:0 2px;font-size:14px;opacity:.35}
.chip .pin[aria-pressed="true"]{opacity:1}
.lv{display:inline-grid;place-items:center;min-width:32px;height:22px;border-radius:5px;font-size:12px;font-weight:700;color:#1B2437}
.lv0{background:var(--l0);color:var(--muted)} .lv25{background:var(--l25)} .lv50{background:var(--l50)} .lv75{background:var(--l75)} .lv100{background:var(--l100);color:#fff}
.slot{border:1.5px dashed var(--muted);border-radius:7px;padding:2px}
.slot select{width:100%;border:0;background:transparent;min-height:30px;font-size:13px}
.idle{display:flex;flex-wrap:wrap;gap:8px}
.idle .chip{background:var(--card)}

.n4{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--chalk);color:#1B2437;font-size:17px;margin-right:8px;vertical-align:middle}
.guide{border:1px solid var(--line);border-left:5px solid var(--ok);border-radius:8px;padding:10px 12px;margin-top:10px;background:var(--card)}
.guide.amb{border-left-color:var(--warn)} .guide.red{border-left-color:var(--stitch)}
.gh{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.gh b{font-size:16px}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.amb{background:var(--warn-soft);color:var(--warn)} .tag.red{background:var(--stitch-soft);color:var(--stitch)}
.grow{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px dashed var(--line);font-size:14px}
.gtime{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:17px;color:var(--denim)}
.gbody>div{margin-bottom:4px}
.alts{margin-top:6px}
.alt{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--paper);border-radius:7px;padding:6px 8px;margin-top:4px}
.bloco{margin-top:16px;padding-top:12px;border-top:3px solid var(--ink)}
.bh{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
.bh b{font-family:"Barlow Condensed",sans-serif;font-size:24px}
.bh span{font-weight:600}
.slotrow{display:flex;gap:6px;align-items:center}
.slotrow select{flex:1;min-width:0;min-height:34px;font-size:14px;font-weight:600;padding:4px 6px}
.mot{font-size:12px;color:var(--muted);margin:-2px 0 2px 38px}
table.pp td{white-space:nowrap}
@media (max-width:560px){.grow{grid-template-columns:1fr}.alt{flex-direction:column;align-items:flex-start}}
/* matrix */
.mvwrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:var(--radius);background:var(--card)}
table.mv{font-size:12px}
table.mv th,table.mv td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0}
table.mv thead th{position:sticky;top:0;background:var(--card);z-index:2}
table.mv thead tr:nth-child(2) th{top:26px}
table.mv th.l{font-family:"Barlow Condensed",sans-serif;font-size:14px;height:26px;background:var(--ink);color:#fff}
table.mv th.pc{writing-mode:vertical-rl;transform:rotate(180deg);height:190px;padding:6px 2px;font-weight:600;white-space:nowrap;text-align:left;font-size:11.5px}
table.mv td.nm,table.mv th.nm{position:sticky;left:0;background:var(--card);z-index:1;min-width:190px;text-align:left;padding:4px 8px}
table.mv thead th.nm{z-index:3}
table.mv td.nm button{border:0;background:transparent;padding:0;font-weight:600;text-align:left;width:100%}
table.mv td.nm small{color:var(--muted)}
table.mv td.c button{width:34px;height:28px;border:0;font-size:11px;font-weight:700;background:var(--l0);color:var(--muted)}
table.mv td.c button.lv25{background:var(--l25);color:#1B2437} table.mv td.c button.lv50{background:var(--l50);color:#1B2437}
table.mv td.c button.lv75{background:var(--l75);color:#1B2437} table.mv td.c button.lv100{background:var(--l100);color:#fff}
table.mv tr.inactive td{opacity:.45}
table.mv tfoot td{position:sticky;bottom:0;background:var(--card);font-weight:700;text-align:center;height:28px}
table.mv tfoot td.bad{color:var(--stitch)} table.mv tfoot td.lim{color:var(--warn)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;align-items:center}

/* forms / lists */
.two{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:16px;margin-top:16px}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column;max-height:65vh;overflow:auto;border-top:1px solid var(--line)}
.list button{border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;padding:10px 8px}
.list button[aria-current="true"]{background:var(--chalk-soft);box-shadow:inset 4px 0 0 var(--chalk)}
.list button small{display:block;color:var(--muted);font-size:12px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.ops{width:100%;border-top:1px solid var(--line)}
.ops td{padding:6px 4px;border-bottom:1px solid var(--line)}
.ops select{width:100%}
.section-title{font-size:22px;margin:22px 0 8px}

/* ranking */
table.rank{width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;font-size:14px}
table.rank th{background:var(--ink);color:#fff;text-align:left;padding:8px;font-weight:600;font-size:13px}
:root[data-theme="dark"] table.rank th{background:#0C1018}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) table.rank th{background:#0C1018}}
table.rank td{padding:8px;border-bottom:1px solid var(--line)}
table.rank tr.top td{background:var(--chalk-soft)}
table.rank td.pos{font-family:"Barlow Condensed",sans-serif;font-size:22px;font-weight:700;width:48px;text-align:center}
.bar{height:8px;background:var(--l0);border-radius:4px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--ok)}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:14px 0}
@media (max-width:700px){.podium{grid-template-columns:1fr}}
.podium .card{border-top:6px solid var(--chalk)}
.podium .card b{font-family:"Barlow Condensed",sans-serif;font-size:26px;display:block}
.tablewrap{overflow-x:auto}

/* modal + toast */
.modal-bg{position:fixed;inset:0;background:rgba(10,14,22,.55);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--card);border-radius:12px;padding:18px;max-width:560px;width:100%;max-height:85vh;overflow:auto}
.modal h3{font-size:22px;margin-bottom:8px}
.modal textarea{width:100%;min-height:260px;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;z-index:60;font-size:14px;max-width:90vw}
:root[data-theme="dark"] .toast{background:#0C1018;border:1px solid var(--line)}
.empty{text-align:center;padding:40px 16px}
.empty h2{font-size:28px;margin-bottom:8px}
@media (max-width:560px){
  .prow{grid-template-columns:1fr}
  .brand h1{font-size:22px}
  .kpi{min-width:0;flex:1}
  .pgrid{grid-template-columns:minmax(0,1fr)}
}

/* ---------- mobile-first upgrades ---------- */
.bnav{display:none}
select{max-width:100%}
input,select,textarea,button{box-sizing:border-box}
.posto,.slotrow,.lineblock,.bloco,.card{min-width:0}
.pgrid{grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr))}
details.step>summary{list-style:none;cursor:pointer}
details.step>summary::-webkit-details-marker{display:none}
details.step>summary h2{margin-bottom:0}
details.step[open]>summary h2{margin-bottom:10px}
details.step>summary .sumline{font-size:13px;color:var(--muted);margin:2px 0 0 40px}
details.step[open]>summary .sumline{display:none}
.chev{margin-left:auto;font-size:14px;color:var(--muted);transition:transform .15s}
details.step[open] .chev{transform:rotate(180deg)}
.blocks{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px;margin-top:6px;scrollbar-width:thin}
.blocks button{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);border-radius:20px;padding:6px 12px;font-weight:600;font-size:13px;white-space:nowrap}
.blocks button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.blocks button .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:6px;vertical-align:middle;background:var(--ok)}
.blocks button .dot.bad{background:var(--stitch)} .blocks button .dot.amb{background:var(--warn)}
.ppcards,.rankcards{display:none}
.lastsend{font-size:12px;color:var(--muted);margin-top:6px}
.actionbar{display:none}
.modal label.ck{display:flex;gap:8px;align-items:center;padding:6px 0;font-size:14px}
.modal .field input,.modal .field textarea{width:100%}
.warnbox{background:var(--warn-soft);border-left:4px solid var(--warn);padding:8px 10px;border-radius:6px;font-size:13px;margin:8px 0}
.okbox{background:var(--ok-soft);border-left:4px solid var(--ok);padding:8px 10px;border-radius:6px;font-size:13px;margin:8px 0}
.help{font-size:13px;color:var(--muted)}
.help ol{padding-left:18px;margin:6px 0}
@media (max-width:760px){
  body{font-size:16px}
  input[type=text],input[type=number],input[type=time],input[type=date],input[type=email],select,textarea{font-size:16px}
  header.top{position:sticky}
  .top-in{padding:8px 14px}
  .brand{padding-bottom:0}
  nav.tabs,.savestate{display:none}
  .wrap{padding:0 10px calc(150px + env(safe-area-inset-bottom,0px))}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .bnav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 8px;font-size:11px;font-weight:600;color:var(--muted)}
  .bnav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .bnav button[aria-selected="true"]{color:var(--denim)}
  .bnav button[aria-selected="true"] svg{stroke-width:2.4}
  .actionbar{display:flex;gap:8px;position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:29;padding:8px 10px;background:linear-gradient(to top,var(--paper) 70%,transparent)}
  .actionbar .btn{flex:1;min-height:46px;font-size:15px}
  .daybar{gap:8px}
  .daybar>label{flex:1}
  .daybar input[type=date]{flex:1}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-left:0;width:100%}
  .kpi{padding:6px 8px}
  .kpi b{font-size:20px}
  .kpi span{font-size:11px;line-height:1.2;display:block}
  .card{padding:12px}
  .step h2{font-size:20px}
  .prow{grid-template-columns:1fr}
  .prow .seg{display:grid;grid-template-columns:repeat(4,1fr);width:100%}
  .escbar .seg{display:grid;grid-template-columns:1fr 1fr;width:100%;max-width:none!important}

<script>
/* ============================ STATE & STORAGE ============================ */
const DEF_SETTINGS={empresa:"Vicon",setor:"Costura",inicio:"07:00",fim:"17:00",almIni:"12:00",almFim:"13:00",contarJustificadas:false,emails:"",emailAssunto:"Escala da costura",emailEndpoint:"",emailToken:"",emailRanking:true};
const S={settings:{...DEF_SETTINGS},postos:[],pessoas:[],produtos:[],dias:{}};
let store=null, tab="dia", curDate=todayISO(), day=null, dayDirty=false;
let selProd=null, rankPeriod="30", mvEditId=null, escView="hora", blocoSel=null, openSteps={s1:window.innerWidth>760,s2:window.innerWidth>760};
let saudeOpen=null, simQ="", simH="", simModo="bal";

function todayISO(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function clone(o){return JSON.parse(JSON.stringify(o))}
function fmtH(h){return (Math.round(h*4)/4).toLocaleString("pt-BR",{maximumFractionDigits:2})+"h"}
function fmtDate(iso){const[y,m,d]=iso.split("-");return `${d}/${m}/${y}`}
function setSave(t){document.getElementById("saveState").textContent=t}
function toast(msg){const r=document.getElementById("toastRoot");r.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(toast._t);toast._t=setTimeout(()=>r.innerHTML="",3200)}

function localStore(){
  const K="vicon_escala_";
  const g=k=>{try{const v=localStorage.getItem(K+k);return v?JSON.parse(v):null}catch(e){return null}};
  const s=(k,v)=>{try{localStorage.setItem(K+k,JSON.stringify(v));return true}catch(e){return false}};
  return{
    mode:"local",
    async load(){
      const L=k=>{const v=g(k);return v&&Array.isArray(v.lista)?v.lista:null};
      const out={settings:g("cfg_settings"),postos:L("cfg_postos"),pessoas:L("cfg_pessoas"),produtos:L("cfg_produtos"),dias:{}};
      try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(K+"dia_")){const v=g(k.slice(K.length));if(v)out.dias[v.data]=v}}}catch(e){}
      return out;
    },
    async saveCfg(key,obj){if(!s("cfg_"+key,obj))throw{message:"armazenamento do navegador indisponível"}},
    async saveDay(d){if(!s("dia_"+d.data,d))throw{message:"armazenamento do navegador indisponível"}},
    async deleteDay(date){try{localStorage.removeItem(K+"dia_"+date)}catch(e){}}
  };
}
function dbStore(db){
  const chain={};
  const q=(path,fn)=>{chain[path]=(chain[path]||Promise.resolve()).then(fn);return chain[path]};
  async function retry(fn){try{return await fn()}catch(e){if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,400+Math.random()*600));return fn()}throw e}}
  return{
    mode:"db",
    async load(){
      const get=async p=>{const s=await retry(()=>db.doc(p).get());return s.exists?s.data():null};
      const [st,po,pe,pr]=await Promise.all([get("cfg/settings"),get("cfg/postos"),get("cfg/pessoas"),get("cfg/produtos")]);
      const dias={};const qs=await retry(()=>db.collection("dias").get());qs.docs.forEach(d=>{const v=d.data();if(v&&v.data)dias[v.data]=v});
      return{settings:st,postos:po&&po.lista,pessoas:pe&&pe.lista,produtos:pr&&pr.lista,dias};
    },
    saveCfg(key,obj){return q("cfg/"+key,()=>retry(()=>db.doc("cfg/"+key).set(clone(obj))))},
    saveDay(d){return q("dias/"+d.data,()=>retry(()=>db.doc("dias/"+d.data).set(clone(d))))},
    deleteDay(date){return q("dias/"+date,()=>retry(()=>db.doc("dias/"+date).delete()))}
  };
}
const pendingCfg={};
function saveCfg(key){
  clearTimeout(pendingCfg[key]);setSave("Salvando…");
  pendingCfg[key]=setTimeout(async()=>{
    const obj=key==="settings"?S.settings:{lista:S[key]};
    try{await store.saveCfg(key,obj);setSave(store.mode==="db"?"Salvo na nuvem":"Salvo neste aparelho")}
    catch(e){setSave("Erro ao salvar");toast("Não foi possível salvar: "+(e.code==="quota_exceeded"?"limite de armazenamento atingido":(e.message||e.code)))}
  },500);
}
let dayTimer=null,pendingDay=null;
async function writeDay(d){
  d.salvoEm=new Date().toISOString();d.turnoH=turnoH();
  S.dias[d.data]=clone(d);
  try{await store.saveDay(d);setSave(store.mode==="db"?"Salvo na nuvem":"Salvo neste aparelho")}
  catch(e){setSave("Erro ao salvar");toast("Não foi possível salvar o dia: "+(e.message||e.code))}
}
function flushDay(){if(pendingDay){clearTimeout(dayTimer);const d=pendingDay;pendingDay=null;writeDay(d)}}
function saveDaySoon(){
  dayDirty=true;if(pendingDay&&pendingDay!==day)flushDay();
  pendingDay=day;clearTimeout(dayTimer);setSave("Salvando…");
  dayTimer=setTimeout(()=>{const d=pendingDay;pendingDay=null;if(d)writeDay(d)},600);
}

/* ============================ DOMAIN ============================ */
const LV=[0,25,50,75,100];
const posto=id=>S.postos.find(p=>p.id===id);
const pessoa=id=>S.pessoas.find(p=>p.id===id);
const produto=id=>S.produtos.find(p=>p.id===id);
const lvl=(p,pid)=>(p&&p.niveis&&p.niveis[pid])||0;
const ativos=()=>S.pessoas.filter(p=>p.ativo!==false);
function linhas(){const o=[];S.postos.forEach(p=>{if(!o.includes(p.linha))o.push(p.linha)});return o}
function mins(t){if(!t)return null;const[a,b]=t.split(":").map(Number);return a*60+(b||0)}
function horasIntervalo(a,b){
  if(a==null||b==null||b<=a)return 0;
  const la=mins(S.settings.almIni),lb=mins(S.settings.almFim);
  let m=b-a;if(la!=null&&lb!=null&&lb>la)m-=Math.max(0,Math.min(b,lb)-Math.max(a,la));
  return Math.max(0,m/60);
}
function turnoH(){return horasIntervalo(mins(S.settings.inicio),mins(S.settings.fim))}
function horasPessoa(pr){
  if(!pr||pr.st==="F"||pr.st==="J")return 0;
  if(pr.st==="A")return horasIntervalo(mins(pr.ent||S.settings.inicio),mins(pr.sai||S.settings.fim));
  return turnoH();
}
function newDay(date){
  const presenca={};ativos().forEach(p=>presenca[p.id]={st:"P"});
  return{data:date,presenca,producao:[],pins:[]};
}
function loadDay(date){
  flushDay();curDate=date;blocoSel=null;dayDirty=false;
  day=S.dias[date]?clone(S.dias[date]):newDay(date);
  ativos().forEach(p=>{if(!day.presenca[p.id])day.presenca[p.id]={st:"P"}});
  day.pins=day.pins||[];delete day.alocacao;
  day.producao=(day.producao||[]).map(it=>({id:it.id||uid("i"),prodId:it.prodId,qtd:it.qtd??null,ini:it.ini||S.settings.inicio,fim:it.fim||S.settings.fim}));
}
function presentes(){return ativos().filter(p=>horasPessoa(day.presenca[p.id])>0.01)}

function hhmm(m){return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")}
function itemWin(it){return[mins(it.ini||S.settings.inicio),mins(it.fim||S.settings.fim)]}
function presWin(pr){
  if(!pr||pr.st==="F"||pr.st==="J")return null;
  if(pr.st==="A")return[mins(pr.ent||S.settings.inicio),mins(pr.sai||S.settings.fim)];
  return[mins(S.settings.inicio),mins(S.settings.fim)];
}
/* Pessoas necessárias no posto durante a janela do item:
   com quantidade e tempo padrão = horas de trabalho ÷ horas da janela (arredonda para cima); sem tempo = 1 pessoa. */
function headcount(it,op){
  const t=Number(op.tempo),q=Number(it.qtd);
  if(t>0&&q>0){const[a,b]=itemWin(it);const h=horasIntervalo(a,b);if(h<=0)return 1;return Math.max(1,Math.ceil(q*t/60/h-1e-6))}
  return 1;
}
/* Divide o dia em blocos de horário: muda o bloco sempre que começa/termina um produto
   ou alguém chega/sai. Cada bloco tem sua própria escala. */
function segmentos(){
  const T0=mins(S.settings.inicio),T1=mins(S.settings.fim);
  const pts=new Set([T0,T1]);
  day.producao.forEach(it=>itemWin(it).forEach(x=>{if(x>T0&&x<T1)pts.add(x)}));
  ativos().forEach(p=>{const w=presWin(day.presenca[p.id]);if(w)w.forEach(x=>{if(x>T0&&x<T1)pts.add(x)})});
  const arr=[...pts].sort((a,b)=>a-b),segs=[];
  for(let i=0;i<arr.length-1;i++){
    const a=arr[i],b=arr[i+1];if(horasIntervalo(a,b)<=0.01)continue;
    const items=day.producao.filter(it=>{const[x,y]=itemWin(it);return x<=a&&y>=b&&produto(it.prodId)});
    if(items.length)segs.push({a,b,h:horasIntervalo(a,b),items});
  }
  return segs;
}
/* Monta a escala de cada bloco.
   Prioridade: (1) ajustes fixados pela líder; (2) cada pessoa no seu posto habitual (nível ≥ 50);
   (3) quem já estava no posto no bloco anterior continua (evita troca-troca);
   (4) preenche primeiro o posto com MENOS aptas (≥ 75) presentes e, no empate, usa a pessoa menos versátil
       (guarda as polivalentes para onde só elas servem);
   (5) troca: se sobrou posto vazio, libera uma apta colocando uma pessoa livre no lugar dela;
   (6) em último caso, nível 50 com acompanhamento. */
function escala(){
  const segs=segmentos();let prev=null;
  for(const s of segs){
    const need={},origem={};
    s.items.forEach(it=>{const pr=produto(it.prodId);(pr.ops||[]).forEach(op=>{if(!posto(op.postoId))return;
      need[op.postoId]=(need[op.postoId]||0)+headcount(it,op);(origem[op.postoId]=origem[op.postoId]||new Set()).add(pr.nome)})});
    const pres=ativos().filter(p=>{const w=presWin(day.presenca[p.id]);return w&&w[0]<=s.a&&w[1]>=s.b});
    const free=new Set(pres.map(p=>p.id)),rem={...need},as=[];
    const put=(k,pid,mot,de)=>{as.push({postoId:k,pid,mot,de});rem[k]--;free.delete(pid)};
    (day.pins||[]).filter(p=>p.ini<=s.a&&p.fim>=s.b&&rem[p.postoId]>0&&free.has(p.pid)).forEach(p=>put(p.postoId,p.pid,"fixado"));
    pres.forEach(p=>{const h=p.habitual;if(h&&free.has(p.id)&&rem[h]>0&&lvl(p,h)>=50)put(h,p.id,"habitual")});
    if(prev)prev.as.forEach(x=>{if(free.has(x.pid)&&rem[x.postoId]>0&&lvl(pessoa(x.pid),x.postoId)>=50)put(x.postoId,x.pid,x.mot==="fixado"?"continua":x.mot,x.de)});
    const fill=minLv=>{for(let g=0;g<400;g++){
      const open=Object.keys(rem).filter(k=>rem[k]>0);let best=null;
      for(const k of open){const c=pres.filter(p=>free.has(p.id)&&lvl(p,k)>=minLv);if(c.length&&(!best||c.length<best.c.length))best={k,c}}
      if(!best)return;
      const flex=p=>open.filter(o=>o!==best.k&&lvl(p,o)>=minLv).length;
      best.c.sort((a,b)=>lvl(b,best.k)-lvl(a,best.k)||flex(a)-flex(b));
      put(best.k,best.c[0].id,minLv>=75?"apta":"apoio50");
    }};
    const swap=minLv=>{
      for(const k of Object.keys(rem).filter(k=>rem[k]>0)){
        for(const x of as.slice()){
          if(!(rem[k]>0))break;if(x.mot==="fixado"||x.postoId===k)continue;
          const X=pessoa(x.pid);if(lvl(X,k)<minLv)continue;
          const Y=pres.find(p=>free.has(p.id)&&lvl(p,x.postoId)>=75);if(!Y)continue;
          free.delete(Y.id);const from=x.postoId;x.pid=Y.id;x.mot="liberou";x.para=X.id;
          as.push({postoId:k,pid:X.id,mot:"troca",de:from});rem[k]--;
        }
      }
    };
    fill(75);swap(75);fill(50);swap(50);
    Object.assign(s,{need,origem,pres,as,rem,idle:[...free]});
    prev=s;
  }
  return segs;
}
const MOT={fixado:"ajuste da líder",habitual:"posto habitual",continua:"continua do bloco anterior",apta:"apta livre",troca:"remanejada",liberou:"cobre quem foi remanejada",apoio50:"nível 50"};

/* ---------- Inteligência: alternativas para um posto num bloco ---------- */
function alternativas(s,k,exclude){
  const nm=id=>pessoa(id)?.nome||"?";
  const assigned=new Map(s.as.map(x=>[x.pid,x]));
  const idle=s.pres.filter(p=>!assigned.has(p.id)&&p.id!==exclude);
  const out=[];
  idle.filter(p=>lvl(p,k)>=75).forEach(p=>out.push({sc:300+lvl(p,k),lv:lvl(p,k),txt:`<b>${esc(p.nome)}</b> está livre e tem nível ${lvl(p,k)} neste posto.`,pins:[[k,p.id]],ok:true}));
  s.as.forEach(x=>{
    if(x.pid===exclude||x.postoId===k||x.mot==="fixado")return;
    const X=pessoa(x.pid),lx=lvl(X,k);if(lx<50)return;
    const j=x.postoId;
    const Ys=idle.filter(p=>lvl(p,j)>=50).sort((a,b)=>lvl(b,j)-lvl(a,j));
    const Y=Ys[0];
    if(!Y)return;
    const ly=lvl(Y,j),ok=lx>=75&&ly>=75;
    out.push({sc:(lx>=75?200:50)+(ly>=75?40:0)+lx/10,lv:lx,ok,
      txt:`Mova <b>${esc(X.nome)}</b> (nível ${lx}) de ${esc(nomePosto(j))} para cá, e <b>${esc(Y.nome)}</b> (nível ${ly}${ly<75?", com acompanhamento":""}) assume ${esc(nomePosto(j))}.`,
      pins:[[k,X.id],[j,Y.id]]});
  });
  idle.filter(p=>lvl(p,k)===50).forEach(p=>out.push({sc:100,lv:50,txt:`<b>${esc(p.nome)}</b> está livre e tem nível 50: pode assumir com acompanhamento da líder nas primeiras peças.`,pins:[[k,p.id]],ok:false}));
  const seen=new Set();
  return out.sort((a,b)=>b.sc-a.sc).filter(o=>{const key=o.pins.map(p=>p.join()).join("|");if(seen.has(key))return false;seen.add(key);return true}).slice(0,3);
}
/* Plano B: se ninguém pode cobrir, sugere produto da mesma família que não use o posto e que tenha gente apta presente */
function planoB(s,k){
  const deps=s.items.filter(it=>(produto(it.prodId).ops||[]).some(o=>o.postoId===k)).map(it=>produto(it.prodId));
  const fams=new Set(deps.map(p=>p.familia));
  const ativosNoBloco=new Set(s.items.map(it=>it.prodId));
  const alt=S.produtos.filter(p=>fams.has(p.familia)&&!ativosNoBloco.has(p.id)&&(p.ops||[]).length&&!(p.ops||[]).some(o=>o.postoId===k)
    &&(p.ops||[]).every(o=>s.pres.some(x=>lvl(x,o.postoId)>=75))).slice(0,2);
  return{deps,alt};
}
/* Agrupa blocos seguidos com a mesma situação num posto (para não repetir a orientação) */
function situacaoPosto(segs,k,exclude){
  const rows=[];
  segs.forEach(s=>{
    if(s.need[k]==null)return;
    const cov=s.as.filter(x=>x.postoId===k).map(x=>x.pid);
    const key=cov.join(",")+"|"+s.rem[k];
    const last=rows[rows.length-1];
    if(last&&last.key===key&&last.b===s.a){last.b=s.b;last.segs.push(s)}
    else rows.push({key,a:s.a,b:s.b,cov,falta:Math.max(0,s.rem[k]),segs:[s]});
  });
  return rows;
}
function orientacoes(segs){
  const cards=[];const tratados=new Set();
  const T0=mins(S.settings.inicio),T1=mins(S.settings.fim);
  ativos().forEach(p=>{
    const pr=day.presenca[p.id]||{st:"P"};if(pr.st==="P")return;
    const w=presWin(pr);
    let quando=pr.st==="F"?"faltou":pr.st==="J"?"faltou (justificada)":"";
    if(pr.st==="A"){const parts=[];if(w&&w[0]>T0)parts.push("chega às "+hhmm(w[0]));if(w&&w[1]<T1)parts.push("sai às "+hhmm(w[1]));quando=parts.join(" e ")||"parcial"}
    const k=p.habitual;
    const rows=k?situacaoPosto(segs,k).filter(r=>!r.cov.includes(p.id)):[];
    if(k)tratados.add(k);
    cards.push({tipo:"pessoa",p,quando,k,rows});
  });
  // postos com problema que não são de ninguém ausente
  const probs=new Map();
  segs.forEach(s=>Object.keys(s.need).forEach(k=>{
    if(tratados.has(k))return;
    const fraco=s.as.filter(x=>x.postoId===k).some(x=>lvl(pessoa(x.pid),k)<75);
    if(s.rem[k]>0||fraco)probs.set(k,true);
  }));
  [...probs.keys()].forEach(k=>cards.push({tipo:"posto",k,rows:situacaoPosto(segs,k).filter(r=>r.falta>0||r.cov.some(pid=>lvl(pessoa(pid),k)<75))}));
  return cards;
}

/* ============================ TAKT, BALANCEAMENTO E GARGALO ============================
   Takt = minutos disponíveis na janela ÷ quantidade pedida.
   Ciclo efetivo do posto = tempo padrão ÷ pessoas no posto.
   Gargalo = posto com maior ciclo efetivo; capacidade = minutos disponíveis ÷ ciclo do gargalo.
   Eficiência de balanceamento = Σ tempos ÷ (Σ pessoas × ciclo do gargalo). */
const fmtN=(v,d=2)=>v==null||!isFinite(v)?"—":Number(v).toLocaleString("pt-BR",{maximumFractionDigits:d});
const fmtMin=v=>fmtN(v,2)+" min";
const fmtPes=v=>fmtN(v,1);
function resumoRitmo(rows,avail,q){
  const takt=q>0&&avail>0?avail/q:null;
  const comT=rows.filter(r=>r.tempo);
  const parados=comT.filter(r=>r.parado);
  const ativos_=comT.filter(r=>!r.parado&&r.ciclo);
  const g=parados[0]||ativos_.reduce((m,r)=>!m||r.ciclo>m.ciclo?r:m,null);
  if(g)g.gargalo=true;
  const cap=!g?null:g.parado?0:Math.floor(avail/g.ciclo+1e-6);
  const sumT=comT.reduce((s,r)=>s+r.tempo,0),sumP=ativos_.reduce((s,r)=>s+r.pessoas,0);
  const efic=g&&!g.parado&&sumP>0?ativos_.reduce((s,r)=>s+r.tempo,0)/(sumP*g.ciclo):null;
  const nop=takt&&sumT?sumT/takt:null;
  return{takt,g,cap,sumT,sumP,efic,nop,semTempo:rows.length-comT.length,total:rows.length,avail,q};
}
/* Dia: usa quem a escala realmente colocou em cada posto durante a janela do produto */
function ritmoItem(it,segs){
  const p=produto(it.prodId);if(!p)return null;
  const[a,b]=itemWin(it);const avail=horasIntervalo(a,b)*60;const q=Number(it.qtd)||0;
  const ss=segs.filter(s=>s.items.includes(it));
  const rows=(p.ops||[]).filter(o=>posto(o.postoId)).map(o=>{
    const k=o.postoId,t=Number(o.tempo)>0?Number(o.tempo):null,hc=headcount(it,o);
    let pes=hc,lv50=false;
    if(ss.length)pes=Math.min(...ss.map(s=>{const as=s.as.filter(x=>x.postoId===k);if(as.some(x=>lvl(pessoa(x.pid),k)<75))lv50=true;return as.length*hc/(s.need[k]||1)}));
    return{k,nome:nomePosto(k),curto:posto(k).nome,tempo:t,nec:hc,pessoas:pes,ciclo:t&&pes>0.001?t/pes:null,parado:!!t&&pes<=0.001,lv50};
  });
  return{it,p,a,b,rows,r:resumoRitmo(rows,avail,q)};
}
/* Produtos: simulação com demanda e horas informadas; pessoas = mínimo para caber no takt */
function ritmoSim(p,q,h){
  const avail=h*60,takt=q>0&&avail>0?avail/q:null;
  const rows=(p.ops||[]).filter(o=>posto(o.postoId)).map(o=>{
    const k=o.postoId,t=Number(o.tempo)>0?Number(o.tempo):null;
    const nec=t&&takt?Math.max(1,Math.ceil(t/takt-1e-6)):1;
    const pes=simModo==="bruto"?1:nec;
    const apt=ativos().filter(x=>lvl(x,k)>=75).length;
    return{k,nome:nomePosto(k),curto:posto(k).nome,tempo:t,nec,pessoas:pes,ciclo:t?t/pes:null,parado:false,apt,lv50:apt<nec};
  });
  return{rows,r:resumoRitmo(rows,avail,q)};
}
function yamazumiSVG(rows,takt,titulo){
  const n=rows.length;if(!n)return"";
  const slot=Math.max(46,Math.min(72,560/n)),L=40,R=64,T=36,PH=190,B=104;
  const W=L+R+slot*n,H=T+PH+B;
  const vmax=Math.max(takt||0,...rows.map(r=>r.ciclo||0),...rows.map(r=>r.parado?r.tempo:0))*1.15||1;
  const y=v=>T+PH-v/vmax*PH;
  const step=(()=>{const raw=vmax/4,m=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/m;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*m})();
  let g="";
  for(let v=0;v<=vmax+1e-9;v+=step){g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" font-size="11" text-anchor="end" fill="var(--muted)">${fmtN(v,2)}</text>`}
  g+=`<text x="${L-6}" y="${T-8}" font-size="11" text-anchor="end" fill="var(--muted)">min</text>`;
  const bw=Math.min(34,slot*.58);
  rows.forEach((r,i)=>{
    const cx=L+slot*i+slot/2,x=cx-bw/2,y0=T+PH;
    const lab=r.curto.length>20?r.curto.slice(0,19)+"…":r.curto;
    let mark="",val="";
    const tip=esc(`${r.nome}\n`+(r.tempo?`Tempo padrão: ${fmtMin(r.tempo)}/peça\nPessoas: ${fmtPes(r.pessoas)}${r.nec!=null&&Math.abs(r.nec-r.pessoas)>.01?` (precisa ${r.nec})`:""}\nCiclo efetivo: ${r.parado?"parado (sem pessoa)":fmtMin(r.ciclo)}${takt&&r.ciclo?`\n${r.ciclo>takt+1e-9?"Acima":"Dentro"} do takt (${fmtMin(takt)})`:""}${r.lv50?"\nAtenção: nível 50 ou aptas insuficientes":""}`:"Sem tempo padrão cadastrado"));
    if(!r.tempo){mark=`<line x1="${x}" x2="${x+bw}" y1="${y0-1}" y2="${y0-1}" stroke="var(--muted)" stroke-width="2" stroke-dasharray="3 3"/>`;val=`<text x="${cx}" y="${y0-8}" font-size="11" text-anchor="middle" fill="var(--muted)">sem tempo</text>`}
    else if(r.parado){const yt=y(r.tempo);mark=`<rect class="bm" x="${x}" y="${yt}" width="${bw}" height="${y0-yt}" rx="4" fill="url(#yzHatch)" stroke="var(--stitch)" stroke-width="1.5" stroke-dasharray="4 3"/>`;val=`<text x="${cx}" y="${yt-6}" font-size="11" font-weight="700" text-anchor="middle" fill="var(--ink)">sem pessoa</text>`}
    else{
      const yt=y(r.ciclo),h=y0-yt,rr=Math.min(4,h,bw/2);
      const over=takt&&r.ciclo>takt+1e-9,near=takt&&!over&&r.ciclo>=takt*.9;
      const fill=over?"var(--stitch)":near?"var(--warn)":"var(--denim)";
      mark=`<path class="bm" d="M${x},${y0}V${yt+rr}Q${x},${yt} ${x+rr},${yt}H${x+bw-rr}Q${x+bw},${yt} ${x+bw},${yt+rr}V${y0}Z" fill="${fill}"/>`;
      if(r.gargalo||over)val=h>20?`<text x="${cx}" y="${yt+14}" font-size="11" font-weight="700" text-anchor="middle" fill="var(--card)">${fmtN(r.ciclo,2)}</text>`:`<text x="${cx}" y="${yt-6}" font-size="11" font-weight="700" text-anchor="middle" fill="var(--ink)">${fmtN(r.ciclo,2)}</text>`;
      if(r.gargalo)val+=`<text x="${cx}" y="${yt-(h>20?7:19)}" font-size="10.5" font-weight="700" text-anchor="middle" fill="var(--stitch)">GARGALO</text>`;
    }
    const pes=r.tempo?`<text x="${cx}" y="${y0+14}" font-size="11" text-anchor="middle" fill="var(--muted)">${fmtPes(r.pessoas)} p${r.lv50?" ⚠":""}</text>`:"";
    g+=`<g class="col" data-tip="${tip}"><rect x="${L+slot*i}" y="${T}" width="${slot}" height="${PH+B}" fill="transparent"/>${mark}${val}${pes}
      <text transform="translate(${cx+3},${y0+26}) rotate(-38)" font-size="11" text-anchor="end" fill="var(--ink)">${esc(lab)}</text></g>`;
  });
  g+=`<line x1="${L}" x2="${W-R}" y1="${T+PH}" y2="${T+PH}" stroke="var(--muted)" stroke-width="1"/>`;
  if(takt){const yt=y(takt);g+=`<line x1="${L}" x2="${W-R}" y1="${yt}" y2="${yt}" stroke="var(--ink)" stroke-width="2" stroke-dasharray="7 5"/><text x="${W-R+6}" y="${yt-3}" font-size="12" font-weight="700" fill="var(--ink)">takt</text><text x="${W-R+6}" y="${yt+11}" font-size="11.5" fill="var(--ink)">${fmtMin(takt)}</text>`}
  return `<div class="yzchart"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(titulo)}">
    <defs><pattern id="yzHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="var(--stitch-soft)"/><line x1="0" y1="0" x2="0" y2="7" stroke="var(--stitch)" stroke-width="2"/></pattern></defs>${g}</svg></div>`;
}
function yamazumiTabela(rows,takt,sim){
  return `<details style="margin-top:6px"><summary class="small" style="cursor:pointer;font-weight:600">Ver tabela por posto</summary><div class="tablewrap"><table class="yztable"><thead><tr><th>Posto</th><th class="r">Min/peça</th><th class="r">Pessoas</th>${sim?`<th class="r hm">Aptas 75+</th>`:`<th class="r hm">Precisa</th>`}<th class="r">Ciclo efetivo</th><th class="hm">Situação</th></tr></thead><tbody>

function kpisRitmo(r,sim){
  const k=(v,t,c="")=>`<div class="kpi ${c}"><b>${v}</b><span>${t}</span></div>`;

  h+=k(r.cap==null?"—":fmtN(r.cap,0)+" pç",r.q?`capacidade · pedido ${fmtN(r.q,0)}`:"capacidade no período",r.cap!=null&&r.q?(r.cap<r.q?"bad":"good"):"");
  h+=k(r.efic==null?"—":fmtN(r.efic*100,0)+"%","eficiência do balanceamento",r.efic!=null&&r.efic<.75?"warn":"");
  h+=k(r.nop==null?"—":fmtN(r.nop,1),sim?"pessoas teóricas (Σ tempo ÷ takt)":"pessoas teóricas · escaladas "+fmtPes(r.sumP));

}
function msgRitmo(r){

  if(r.cap<r.q){const falta=r.q-r.cap;return `<div class="alert red yzmsg">O gargalo <b>${esc(r.g.nome)}</b> (${fmtMin(r.g.ciclo)} por peça) limita a produção a <b>${fmtN(r.cap,0)} peças</b>: faltam ${fmtN(falta,0)} para o pedido. Coloque mais uma pessoa apta nesse posto, passe parte do trabalho dele para o posto vizinho com folga, ou estenda o horário em ${fmtN(falta*r.g.ciclo,0)} min.</div>`}

/* ============================ SAÚDE DA MATRIZ ============================ */
function saudeMatriz(){
  const at=ativos(),out=[];
  const usados=new Set(S.produtos.flatMap(p=>(p.ops||[]).map(o=>o.postoId)));
  const nomes=a=>{const n=a.map(p=>esc(p.nome));return n.length>1?n.slice(0,-1).join(", ")+" e "+n[n.length-1]:n.join("")};
  at.forEach(p=>{
    if(p.habitual&&!posto(p.habitual))out.push({sev:"red",g:"Posto habitual",txt:`<b>${esc(p.nome)}</b>: o posto habitual cadastrado não existe mais.`,sub:"Escolha outro posto habitual.",id:p.id});
    else if(p.habitual&&lvl(p,p.habitual)<50)out.push({sev:"red",g:"Posto habitual",txt:`<b>${esc(p.nome)}</b> tem posto habitual <b>${esc(nomePosto(p.habitual))}</b>, mas está com nível ${lvl(p,p.habitual)} nele.`,sub:"A escala só coloca alguém no posto habitual com nível 50 ou mais. Corrija o posto habitual ou o nível na matriz.",id:p.id});
  });
  const hab={};at.forEach(p=>{if(p.habitual&&posto(p.habitual))(hab[p.habitual]=hab[p.habitual]||[]).push(p)});
  Object.entries(hab).filter(([,v])=>v.length>1).forEach(([k,v])=>out.push({sev:"info",g:"Posto habitual",txt:`${nomes(v)} têm o mesmo posto habitual (${esc(nomePosto(k))}).`,sub:"Sem tempo padrão o posto pede 1 pessoa: as demais vão para outro posto ou ficam livres."}));
  S.postos.forEach(q=>{
    const ap=at.filter(p=>lvl(p,q.id)>=75),f50=at.filter(p=>lvl(p,q.id)===50),meta=q.meta??2,uso=usados.has(q.id);
    const form=f50.length?`Em formação (nível 50): ${nomes(f50)}.`:"Ninguém com nível 50: escolha quem começar a treinar.";
    if(!ap.length)out.push({sev:uso?"red":"amb",g:"Cobertura dos postos",txt:`<b>${esc(nomePosto(q.id))}</b>: nenhuma pessoa apta (75 ou mais).${uso?" Sempre que este posto estiver no plano, fica descoberto ou com nível 50.":" Não está em nenhum roteiro de produto."}`,sub:form});
    else if(ap.length===1&&meta>1)out.push({sev:"amb",g:"Cobertura dos postos",txt:`<b>${esc(nomePosto(q.id))}</b> depende só de <b>${esc(ap[0].nome)}</b>. Numa falta, o posto fica sem pessoa apta.`,sub:form});
    else if(ap.length<meta)out.push({sev:"info",g:"Cobertura dos postos",txt:`<b>${esc(nomePosto(q.id))}</b>: ${ap.length} aptas para meta de ${meta}.`,sub:form});
  });
  at.forEach(p=>{if(!S.postos.some(q=>lvl(p,q.id)>=75))out.push({sev:"amb",g:"Pessoas",txt:`<b>${esc(p.nome)}</b> não é apta (75 ou mais) em nenhum posto.`,sub:"Na escala ela só entra com nível 50 e acompanhamento, ou fica de apoio.",id:p.id})});
  const vol=at.filter(p=>!p.habitual);
  if(vol.length)out.push({sev:"info",g:"Pessoas",txt:`${vol.length} pessoa(s) sem posto habitual (volantes): ${nomes(vol)}.`,sub:"A escala usa essas pessoas onde faltar gente. Se alguma tem posto fixo, cadastre o habitual."});
  const st=S.produtos.filter(p=>(p.ops||[]).length&&(p.ops||[]).some(o=>!(Number(o.tempo)>0)));
  if(st.length)out.push({sev:"info",g:"Produtos",txt:`${st.length} de ${S.produtos.length} produto(s) sem tempo padrão em algum posto: ${esc(st.slice(0,4).map(p=>p.nome).join(", "))}${st.length>4?"…":""}.`,sub:"Sem o tempo, cada posto pede 1 pessoa e não dá para calcular takt, Yamazumi nem gargalo.",prod:st[0].id});
  const vazio=S.produtos.filter(p=>!(p.ops||[]).length);
  if(vazio.length)out.push({sev:"amb",g:"Produtos",txt:`${vazio.length} produto(s) sem nenhum posto no roteiro: ${esc(vazio.map(p=>p.nome).join(", "))}.`,sub:"Esses produtos não geram escala.",prod:vazio[0].id});
  return out;
}
function saudeHtml(){

  const grupos=["Posto habitual","Cobertura dos postos","Pessoas","Produtos"];

    ${c.red?`<span class="tag red">${c.red} crítico${c.red>1?"s":""}</span>`:""}${c.amb?`<span class="tag amb">${c.amb} atenção</span>`:""}${c.info?`<span class="tag info">${c.info} aviso${c.info>1?"s":""}</span>`:""}<span class="chev">▼</span></summary>
    <p class="small muted" style="margin:6px 0 0">Verificação automática da matriz, dos postos habituais e dos roteiros. Atualiza a cada mudança.</p>`;
  grupos.forEach(g=>{const xs=it.filter(x=>x.g===g).sort((a,b)=>ord[a.sev]-ord[b.sev]);if(!xs.length)return;

  return h+`</details>`;
}

function viewOrientacao(segs){

  const render1=c=>{
    let head,sub;
    if(c.tipo==="pessoa"){
      head=`${esc(c.p.nome)} ${esc(c.quando)}`;
      if(!c.k)sub=`Sem posto habitual cadastrado. Não há substituição a fazer.`;

    ${c.rows.map(r=>rowGuia(c.k,r)).join("")}</div>`;
  };
  const sev=c=>c.rows.some(r=>r.falta>0)?2:c.rows.some(r=>r.cov.some(pid=>lvl(pessoa(pid),c.k)<75))?1:0;
  const pessoasC=cards.filter(c=>c.tipo==="pessoa"),cron=cards.filter(c=>c.tipo==="posto");

  if(cronAmb.length)h+=`<details style="margin-top:12px"><summary class="small" style="cursor:pointer;font-weight:600">${cronAmb.length} posto(s) operando com nível 50 todos os dias — ver orientação</summary>${cronAmb.map(render1).join("")}</details>`;

function rowGuia(k,r){

      let why="";

  }

    const curLv=exclude?lvl(pessoa(exclude),k):-1;
    const alts=alternativas(s,k,exclude).filter(o=>r.falta>0||o.lv>curLv);
    if(alts.length)h+=`<div class="alts"><span class="small muted">${r.falta>0?"Como cobrir:":"Opção melhor:"}</span>${alts.map(o=>`<div class="alt"><span>${o.txt}</span><button class="btn sm ${o.ok?"primary":""}" data-act="aplicar" data-a="${r.a}" data-b="${r.b}" data-pins='${esc(JSON.stringify(o.pins))}'>Aplicar</button></div>`).join("")}</div>`;
    if(r.falta>0){
      const pb=planoB(s,k);
      h+=`<div class="alts"><span class="small muted">Se ninguém puder assumir:</span><ul class="small" style="margin:4px 0 0;padding-left:18px">
        ${pb.alt.map(p=>`<li>Troque a sequência: produza <b>${esc(p.nome)}</b> neste horário (não passa por ${esc(nomePosto(k))} e há gente apta presente) e deixe ${esc(pb.deps.map(d=>d.nome).join(", "))} para depois.</li>`).join("")}

  return h+`</div></div>`;

function viewBloco(s){

  linhas().forEach(L=>{
    const ks=S.postos.filter(p=>p.linha===L&&s.need[p.id]!=null);if(!ks.length)return;
    h+=`<div class="lineblock"><h3>${esc(L)}<small>${ks.length} postos</small></h3><div class="pgrid">`;

      h+=`<div class="posto ${gap?"gap":sup?"sup":""}"><div class="ph"><b>${esc(pp.nome)}</b><span>${n>1?n+" pessoas":""}</span></div>`;
      slots.forEach(x=>{
        const cur=x?x.pid:"";const l=x?lvl(pessoa(cur),pp.id):0;
        const pinned=x&&x.mot==="fixado";
        const opts=s.pres.slice().sort((a,b)=>lvl(b,pp.id)-lvl(a,pp.id)||a.nome.localeCompare(b.nome)).map(p=>{
          const where=s.as.find(y=>y.pid===p.id);
          const extra=p.id===cur?"":where?` — está em ${nomePosto(where.postoId)}`:" — livre";
          return `<option value="${p.id}" ${p.id===cur?"selected":""}>${lvl(p,pp.id)} · ${esc(p.nome)}${esc(extra)}</option>`}).join("");
        h+=`<div class="slotrow">${x?`<span class="lv lv${l}">${l}</span>`:`<span class="lv lv0">—</span>`}
          <select data-act="slot" data-k="${pp.id}" data-a="${s.a}" data-b="${s.b}" data-cur="${cur}" aria-label="${esc(pp.nome)}">
          ${x?"":`<option value="" selected>Descoberto — escolher…</option>`}${pinned?`<option value="__auto">Voltar ao automático</option>`:""}${opts}</select></div>
          ${x?`<div class="mot">${esc(MOT[x.mot]||"")}${x.mot==="troca"?" de "+esc(nomePosto(x.de)):""}</div>`:""}`;
      });
      h+=`</div>`;
    });
    h+=`</div></div>`;
  });
  if(s.idle.length){
    h+=`<div class="lineblock"><h3>Livres neste horário<small>use para apoio ou treinamento</small></h3><div class="idle">${s.idle.map(pid=>{const p=pessoa(pid);

      return `<div class="chip"><span class="nm">${esc(p.nome)}</span>${trein.length?`<span class="small muted">treinar: ${esc(trein.join(", "))}</span>`:""}</div>`}).join("")}</div></div>`;
  }
  return h+`</div>`;
}

  h+=`</tbody></table></div><div class="ppcards">`;

      return `<div class="ln"><span>${hhmm(s.a)}–${hhmm(s.b)}</span><span>${v}</span></div>`}).join("")+`</div>`;
  });
  return h+`</div>`;
}

function textoGrupo(){

  if(f.length)t+=`Faltas: ${f.join(", ")}\n`;if(pa.length)t+=`Parciais: ${pa.join(", ")}\n`;

      t+=`_${L}_\n`;ks.forEach(pp=>{const as=s.as.filter(x=>x.postoId===pp.id);t+=`• ${pp.nome}: ${as.length?as.map(x=>nm(x.pid)).join(" + "):"DESCOBERTO"}${s.rem[pp.id]>0&&as.length?" (falta "+s.rem[pp.id]+")":""}\n`})});

}
/* ---------- ajustes da líder (fixações por horário) ---------- */
function cutPins(match,a,b){
  const out=[];
  (day.pins||[]).forEach(p=>{
    if(!match(p)||p.fim<=a||p.ini>=b){out.push(p);return}
    if(p.ini<a)out.push({...p,fim:a});
    if(p.fim>b)out.push({...p,ini:b});
  });
  day.pins=out;
}
function fixar(k,pid,a,b){
  cutPins(p=>p.pid===pid,a,b);
  day.pins.push({ini:a,fim:b,postoId:k,pid});
}

/* ============================ VIEW: ASSIDUIDADE ============================ */
function rankData(){
  const days=Object.values(S.dias).sort((a,b)=>a.data.localeCompare(b.data));
  let from=null;
  if(rankPeriod==="mes")from=curDate.slice(0,7)+"-01";
  else if(rankPeriod!=="tudo"){const d=new Date(curDate+"T12:00:00");d.setDate(d.getDate()-Number(rankPeriod)+1);from=d.toISOString().slice(0,10)}
  const sel=days.filter(d=>(!from||d.data>=from)&&d.data<=curDate);
  const cj=!!S.settings.contarJustificadas;
  const m={};
  sel.forEach(d=>{
    const T=d.turnoH||turnoH();
    Object.entries(d.presenca||{}).forEach(([pid,pr])=>{
      const p=pessoa(pid);if(!p||p.ativo===false)return;
      const o=m[pid]=m[pid]||{p,dias:0,F:0,J:0,A:0,prev:0,perd:0};
      o.dias++;o.prev+=T;
      if(pr.st==="F"){o.F++;o.perd+=T}
      else if(pr.st==="J"){o.J++;if(cj)o.perd+=T;else o.prev-=T}
      else if(pr.st==="A"){o.A++;o.perd+=Math.max(0,T-horasPessoa(pr))}
    });
  });
  const list=Object.values(m).map(o=>({...o,ass:o.prev>0?1-o.perd/o.prev:1,oc:o.F+o.A+(cj?o.J:0)}));
  list.sort((a,b)=>b.ass-a.ass||a.oc-b.oc||b.dias-a.dias||a.p.nome.localeCompare(b.p.nome));
  const serie=sel.map(d=>{const T=d.turnoH||turnoH();let prev=0,perd=0;Object.entries(d.presenca||{}).forEach(([pid,pr])=>{if(!pessoa(pid))return;prev+=T;if(pr.st==="F"||pr.st==="J")perd+=T;else if(pr.st==="A")perd+=Math.max(0,T-horasPessoa(pr))});return{data:d.data,taxa:prev?perd/prev:0}});
  return{list,serie,n:sel.length};
}
function viewRank(){
  const {list,serie,n}=rankData();
  const pct=v=>(v*100).toLocaleString("pt-BR",{maximumFractionDigits:1})+"%";
  let h=`<div class="row" style="margin-top:16px"><h2 style="font-size:28px;flex:1">Ranking de assiduidade</h2>
    <label class="row small"><span class="muted">Período</span><select data-act="period">
    ${[["7","Últimos 7 dias"],["30","Últimos 30 dias"],["90","Últimos 90 dias"],["mes","Mês da data selecionada"],["tudo","Todo o histórico"]].map(([v,t])=>`<option value="${v}" ${rankPeriod===v?"selected":""}>${t}</option>`).join("")}</select></label></div>
    <p class="muted small">Assiduidade = horas trabalhadas ÷ horas previstas no turno. Contam faltas, atrasos e saídas antecipadas; faltas justificadas ${S.settings.contarJustificadas?"<b>também contam</b>":"<b>não penalizam</b>"} (mude em Ajustes). Empate: menos ocorrências, depois mais dias registrados. ${n} dia(s) registrado(s) no período.</p>`;
  if(!list.length)return h+`<div class="card empty"><h2>Sem dias registrados no período</h2><p class="muted">O ranking se forma a partir da presença lançada na aba Dia.</p></div>`;
  const top=list.slice(0,3);
  h+=`<div class="podium">${top.map((o,i)=>`<div class="card"><span class="muted small">${i+1}º lugar</span><b>${esc(o.p.nome)}</b><span>${pct(o.ass)} de assiduidade · ${o.oc} ocorrência(s) em ${o.dias} dia(s)</span></div>`).join("")}</div>`;
  const avg=serie.length?serie.reduce((s,x)=>s+x.taxa,0)/serie.length:0;
  h+=`<div class="card" style="margin-bottom:14px"><div class="row"><b style="flex:1">Absenteísmo por dia (horas perdidas ÷ horas previstas)</b><span class="small muted">média ${pct(avg)}</span></div>${sparkBars(serie.slice(-40))}</div>`;
  h+=`<div class="rankcards">${list.map((o,i)=>`<div class="rankcard ${i<3?"top":""}"><span class="pos">${i+1}</span><b>${esc(o.p.nome)}</b><span class="pct">${pct(o.ass)}</span><small>${o.dias} dia(s) · ${o.F} falta(s) · ${o.J} justif. · ${o.A} parcial(is) · ${fmtH(o.perd)} perdidas</small></div>`).join("")}</div>`;
  h+=`<div class="tablewrap rank-table"><table class="rank"><thead><tr><th>#</th><th>Nome</th><th>Função</th><th>Dias</th><th>Faltas</th><th>Justif.</th><th>Parciais</th><th>Horas perdidas</th><th>Assiduidade</th></tr></thead><tbody>
  ${list.map((o,i)=>`<tr class="${i<3?"top":""}"><td class="pos">${i+1}</td><td><b>${esc(o.p.nome)}</b></td><td>${esc(o.p.funcao||"")}</td><td>${o.dias}</td><td>${o.F}</td><td>${o.J}</td><td>${o.A}</td><td>${fmtH(o.perd)}</td>
  <td><div class="row" style="flex-wrap:nowrap"><div class="bar" style="flex:1"><i style="width:${Math.max(0,o.ass*100)}%"></i></div><b>${pct(o.ass)}</b></div></td></tr>`).join("")}</tbody></table></div>`;
  return h;
}
function sparkBars(s){
  if(!s.length)return `<p class="muted small">Sem dados.</p>`;
  const W=Math.max(300,s.length*22),H=120,mx=Math.max(0.1,...s.map(x=>x.taxa));
  const bw=W/s.length;
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H+22}" width="100%" style="min-width:${Math.min(W,600)}px" role="img" aria-label="Absenteísmo diário">
  ${s.map((x,i)=>{const bh=x.taxa/mx*H;return `<rect x="${i*bw+3}" y="${H-bh}" width="${bw-6}" height="${Math.max(bh,1)}" rx="2" fill="${x.taxa>0.15?"var(--stitch)":x.taxa>0.05?"var(--warn)":"var(--ok)"}"><title>${fmtDate(x.data)}: ${(x.taxa*100).toFixed(1)}%</title></rect>
  <text x="${i*bw+bw/2}" y="${H+15}" font-size="10" text-anchor="middle" fill="var(--muted)">${x.data.slice(8)}/${x.data.slice(5,7)}</text>`}).join("")}</svg></div>`;
}

    case"delProd":confirmBox(`Excluir o produto “${produto(selProd)?.nome}”?`,"Excluir",()=>{S.produtos=S.produtos.filter(p=>p.id!==selProd);selProd=null;saveCfg("produtos");render()});break;

      b.className="lv"+nv;b.textContent=nv||"";b.setAttribute("aria-label",b.getAttribute("aria-label").replace(/\d+$/,nv));updateMvTotals(p,k);
      {const sd=document.getElementById("saude");if(sd)sd.outerHTML=saudeHtml()}break}

    case"delPessoa":confirmBox(`Excluir ${pessoa(b.dataset.id)?.nome} da matriz? O histórico de presença continua salvo, mas deixa de aparecer no ranking.`,"Excluir",()=>{S.pessoas=S.pessoas.filter(p=>p.id!==b.dataset.id);mvEditId=null;saveCfg("pessoas");render()});break;
    case"addPosto":S.postos.push({id:uid("p"),nome:"Novo posto",linha:linhas().slice(-1)[0]||"Linha 1",meta:2});saveCfg("postos");render();break;

      confirmBox(`Excluir o posto “${p.nome}”?${uso?` Ele está em ${uso} roteiro(s) de produto e será retirado deles.`:""}`,"Excluir",()=>{S.postos.splice(i,1);S.produtos.forEach(x=>x.ops=(x.ops||[]).filter(o=>o.postoId!==p.id));S.pessoas.forEach(x=>{if(x.niveis)delete x.niveis[p.id];if(x.habitual===p.id)x.habitual=""});saveCfg("postos");saveCfg("produtos");saveCfg("pessoas");render()});break}
    case"export":exportar();break;
  }
});
app.addEventListener("change",e=>{
  const t=e.target,a=t.dataset.act,i=Number(t.dataset.i);
  if(t.id==="dateIn"){loadDay(t.value||todayISO());render();return}
  if(t.id==="xlsxIn"&&t.files[0]){importXlsx(t.files[0]);t.value="";return}
  if(t.id==="jsonIn"&&t.files[0]){importJson(t.files[0]);t.value="";return}
  if(t.id==="addLineSel"&&t.value){const p=produto(selProd);const used=new Set(p.ops.map(o=>o.postoId));S.postos.filter(q=>q.linha===t.value&&!used.has(q.id)).forEach(q=>p.ops.push({postoId:q.id,tempo:null}));if(!p.familia)p.familia=t.value;saveCfg("produtos");render();return}
  switch(a){
    case"ent":case"sai":day.presenca[t.dataset.p][a]=t.value;saveDaySoon();render();break;
    case"itField":{const f=t.dataset.f;day.producao[i][f]=f==="qtd"?(t.value===""?null:Number(t.value)):(t.value||(f==="ini"?S.settings.inicio:S.settings.fim));saveDaySoon();render();break}
    case"slot":{const k=t.dataset.k,A=Number(t.dataset.a),B=Number(t.dataset.b),cur=t.dataset.cur,v=t.value;
      if(v==="__auto")cutPins(x=>x.postoId===k,A,B);
      else if(v){if(cur)cutPins(x=>x.postoId===k&&x.pid===cur,A,B);fixar(k,v,A,B)}
      saveDaySoon();render();break}
    case"period":rankPeriod=t.value;render();break;
    case"opPosto":produto(selProd).ops[i].postoId=t.value;saveCfg("produtos");render();break;
    case"opTempo":produto(selProd).ops[i].tempo=t.value===""?null:Number(t.value);saveCfg("produtos");render();break;
    case"sim":if(t.dataset.f==="q")simQ=t.value;else simH=t.value;render();break;
    case"pField":produto(selProd)[t.dataset.f]=t.value;saveCfg("produtos");document.getElementById("prodList").innerHTML=prodListHtml(document.getElementById("prodFilter").value);break;
    case"peField":pessoa(mvEditId)[t.dataset.f]=t.value;saveCfg("pessoas");render();break;
    case"peAtivo":pessoa(mvEditId).ativo=t.checked;saveCfg("pessoas");render();break;
    case"poNome":S.postos[i].nome=t.value;saveCfg("postos");break;
    case"poLinha":S.postos[i].linha=t.value||"Apoio";saveCfg("postos");render();break;
    case"poMeta":S.postos[i].meta=Number(t.value)||0;saveCfg("postos");render();break;
    case"set":S.settings[t.dataset.f]=t.value;saveCfg("settings");render();break;
    case"setCJ":S.settings.contarJustificadas=t.checked;saveCfg("settings");break;
    case"setTxt":S.settings[t.dataset.f]=t.value.trim();saveCfg("settings");break;
    case"setRk":S.settings.emailRanking=t.checked;saveCfg("settings");break;
  }
});

/* tooltip dos gráficos (mouse e toque) */
(function(){
  let tip=null;
  const hide=()=>{if(tip){tip.remove();tip=null}};
  const show=e=>{
    const g=e.target.closest&&e.target.closest("[data-tip]");if(!g){hide();return}
    if(!tip){tip=document.createElement("div");tip.className="charttip";tip.setAttribute("role","status");document.body.appendChild(tip)}
    tip.innerHTML=esc(g.dataset.tip).replace(/\n/g,"<br>");
    const w=tip.offsetWidth,hh=tip.offsetHeight;
    let x=e.clientX+14,y=e.clientY-hh-12;
    if(x+w>window.innerWidth-8)x=e.clientX-w-14;if(x<8)x=8;if(y<8)y=e.clientY+18;
    tip.style.left=x+"px";tip.style.top=y+"px";
  };
  app.addEventListener("pointermove",show);
  app.addEventListener("pointerdown",show);
  app.addEventListener("pointerleave",hide);
  window.addEventListener("scroll",hide,{passive:true});
})();

function updateMvTotals(p,k){
